[Heltec_t1]
extends = nrf52_base
board = heltec_t1
board_build.ldscript = boards/nrf52840_s140_v6.ld
build_unflags =
  -D ENV_INCLUDE_AHTX0=1
  -D ENV_INCLUDE_BME280=1
  -D ENV_INCLUDE_BMP280=1
  -D ENV_INCLUDE_SHTC3=1
  -D ENV_INCLUDE_SHT4X=1
  -D ENV_INCLUDE_LPS22HB=1
  -D ENV_INCLUDE_INA3221=1
  -D ENV_INCLUDE_INA219=1
  -D ENV_INCLUDE_INA226=1
  -D ENV_INCLUDE_INA260=1
  -D ENV_INCLUDE_MLX90614=1
  -D ENV_INCLUDE_VL53L0X=1
  -D ENV_INCLUDE_BME680=1
  -D ENV_INCLUDE_BMP085=1
build_flags = ${nrf52_base.build_flags}
  ${heltec_ui_common.build_flags}
  ${sensor_base.build_flags}
  -I lib/nrf52/s140_nrf52_6.1.1_API/include
  -I lib/nrf52/s140_nrf52_6.1.1_API/include/nrf52
  -I variants/heltec_t1
  -I src/heltec
  -D HELTEC_T1
  -D NRF52_POWER_MANAGEMENT
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=22
  -D HELTEC_USE_ORLP_ED25519_VERIFY=1
  -D HELTEC_SENSOR_MANAGER=1
  -D HELTEC_MESH_UI=1
  -D HELTEC_DISPLAY_ST7735=1
  -D UI_THEME_MONO=1
  -D MOMENTARY_BUTTON_MAX=2
  -D ED25519_NO_SEED
  -D PIN_BUZZER=9
  -D HAS_BUZZER_VOLUME_CONTROL=1
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=32
  -D OFFLINE_QUEUE_SIZE=128
  -D ENV_SKIP_GPS_DETECT=1
  -D GPS_UC6580_CONFIGURE=1
  -D ENV_INCLUDE_COMPASS=1
  -D GPS_NOTIFY_INTERVAL_SEC=1
  -D ICM42607_COMPASS_A_LAYOUT=2
  -D ICM42607_COMPASS_M_LAYOUT=0
  -D ICM_COMPASS_LOOP_MS=50
  -D COMPASS_NOTIFY_INTERVAL_MS=200
  -D COMPASS_HEADING_FILTER_ALPHA=0.2
  -D COMPASS_HEADING_OFFSET_DEG=270
  -D COMPASS_DIAL_EDGE_MARGIN=1
  -D COMPASS_INFO_COL_WIDTH_PCT=40
  -D COMPASS_INFO_COL_MARGIN_RIGHT=4
  -D COMPASS_NEEDLE_RADIUS_INSET=2
  -D COMPASS_NEEDLE_TIP_PCT=39
  -D COMPASS_NEEDLE_BASE_PCT=17
  -D LV_CONF_SKIP=1
  -D LV_COLOR_DEPTH=16
  -D LV_DRAW_COMPLEX=1
  -D LV_MEM_SIZE=73728U
  -D LV_USE_LOG=0
  -D LV_TICK_CUSTOM=1
  -D LV_LAYER_SIMPLE_BUF_SIZE=3200U
  -D LV_SHADOW_CACHE_SIZE=0
  -D LV_GRAD_CACHE_DEF_SIZE=0
  -D LV_USE_GRID=0
  -D LV_USE_ANIMIMG=0
  -D LV_USE_THEME_DEFAULT=0
  -D LV_USE_THEME_BASIC=0
  -D LV_USE_THEME_MONO=1
  -D LV_BUILD_EXAMPLES=0
  -D LV_USE_DEMO_WIDGETS=0
  -D LV_USE_DEMO_KEYPAD_AND_ENCODER=0
  -D LV_USE_DEMO_BENCHMARK=0
  -D LV_USE_DEMO_STRESS=0
  -D LV_USE_DEMO_MUSIC=0
  -D LV_USE_KEYBOARD=1
  -D LV_USE_TEXTAREA=1
  -D LV_USE_ARC=0
  -D LV_USE_BAR=1
  -D LV_USE_CALENDAR=0
  -D LV_USE_CALENDAR_HEADER_ARROW=0
  -D LV_USE_CALENDAR_HEADER_DROPDOWN=0
  -D LV_USE_CANVAS=0
  -D LV_USE_CHART=0
  -D LV_USE_CHECKBOX=0
  -D LV_USE_ROLLER=0
  -D LV_USE_LED=0
  -D LV_USE_LIST=0
  -D LV_USE_MENU=1
  -D LV_USE_METER=0
  -D LV_USE_MSGBOX=0
  -D LV_USE_SLIDER=1
  -D LV_USE_SPAN=0
  -D LV_USE_SPINBOX=0
  -D LV_USE_SPINNER=0
  -D LV_USE_TABLE=0
  -D LV_USE_TABVIEW=0
  -D LV_USE_WIN=0
  -D LV_SPRINTF_USE_FLOAT=0
  -D LV_FONT_MONTSERRAT_10=0
  -D LV_FONT_ARIAL_10=1
  -D LV_FONT_CUSTOM_DECLARE=LV_FONT_DECLARE(lv_font_arial_10)
  '-D LV_FONT_DEFAULT=&lv_font_arial_10'
  -fpermissive
build_src_filter = ${nrf52_base.build_src_filter}
  +<helpers/*.cpp>
  +<../variants/heltec_t1>
  -<../variants/heltec_t1/images.cpp>
  -<Identity.cpp>
  +<heltec/crypto/Identity.cpp>
  -<helpers/ESP32Board.cpp>
  -<helpers/ui/ST7735Display.cpp>
  -<helpers/ui/MomentaryButton.cpp>
  -<helpers/sensors>
  -<helpers/sensors/EnvironmentSensorManager.cpp>
  +<heltec/app/*.cpp>
  -<heltec/app/mesh_app_ui_map.cpp>
  -<heltec/app/map_geo.cpp>
  +<heltec/config/*.cpp>
  +<heltec/ui/*.cpp>
  +<heltec/ui/**/*.cpp>
  -<heltec/ui/theme/ui_theme_pixel.cpp>
  -<heltec/ui/map/*.cpp>
  +<../variants/heltec_t1/images.cpp>
  +<heltec/drivers/input/key_input.cpp>
  +<heltec/drivers/input/momentary_button.cpp>
  +<heltec/drivers/display/display_port.cpp>
  +<heltec/drivers/display/st7735_port.cpp>
  +<helpers/ui/buzzer.cpp>
lib_deps =
  ${nrf52_base.lib_deps}
  ${sensor_base.lib_deps}
  adafruit/Adafruit ST7735 and ST7789 Library @ ^1.11.0
  densaugeo/base64 @ ~1.4.0
  end2endzone/NonBlockingRTTTL@^1.3.0
  file://lib/lvgl
debug_tool = jlink
upload_protocol = nrfutil

[env:Heltec_t1_repeater]
extends = Heltec_t1
build_src_filter = ${Heltec_t1.build_src_filter}
  +<../examples/simple_repeater>

build_flags =
  ${Heltec_t1.build_flags}
  -D ADVERT_NAME='"Heltec_t1 Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1

[env:Heltec_t1_room_server]
extends = Heltec_t1
build_src_filter = ${Heltec_t1.build_src_filter}
  +<../examples/simple_room_server>
build_flags =
  ${Heltec_t1.build_flags}
  -D ADVERT_NAME='"Heltec_t1 Room"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ROOM_PASSWORD='"hello"'
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1

[env:Heltec_t1_companion_radio_ble]
extends = Heltec_t1
board_build.ldscript = boards/nrf52840_s140_v6_extrafs.ld
board_upload.maximum_size = 712704
build_unflags =
  ${Heltec_t1.build_unflags}
build_flags =
  ${Heltec_t1.build_flags}
  -D BLE_PIN_CODE=123456
  -I include
  -D CFG_TUSB_CONFIG_FILE=\"nrf52_tusb_cdc_config.h\"
  ;-D MESH_DEBUG=1
  ;-D GPS_NMEA_DEBUG=1
build_src_filter = ${Heltec_t1.build_src_filter}
  +<heltec/sensors/*.cpp>
  +<heltec/sensors/*.c>
  +<helpers/nrf52/*.cpp>
lib_deps =
  ${Heltec_t1.lib_deps}
  stevemarple/MicroNMEA @ ^2.0.6
  file://lib/mmc5983ma

[env:Heltec_t1_companion_radio_usb]
extends = Heltec_t1
board_build.ldscript = boards/nrf52840_s140_v6_extrafs.ld
board_upload.maximum_size = 712704
build_unflags =
  ${Heltec_t1.build_unflags}
build_flags =
  ${Heltec_t1.build_flags}
  ;-D MAX_CONTACTS=350
  ;-D MAX_GROUP_CHANNELS=40
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${Heltec_t1.build_src_filter}
  +<heltec/sensors/*.cpp>
  +<heltec/sensors/*.c>
  +<helpers/nrf52/*.cpp>
lib_deps =
  ${Heltec_t1.lib_deps}
  stevemarple/MicroNMEA @ ^2.0.6
  file://lib/mmc5983ma

[env:Heltec_t1_kiss_modem]
extends = Heltec_t1
build_src_filter = ${Heltec_t1.build_src_filter}
  +<../examples/kiss_modem/>
