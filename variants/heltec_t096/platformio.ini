[Heltec_t096]
extends = nrf52_base
board = heltec_t096
board_build.ldscript = boards/nrf52840_s140_v6.ld
build_flags = ${nrf52_base.build_flags}
  ${sensor_base.build_flags}
  -I lib/nrf52/s140_nrf52_6.1.1_API/include
  -I lib/nrf52/s140_nrf52_6.1.1_API/include/nrf52
  -I variants/heltec_t096
  -I src/helpers/ui
  -D HELTEC_T096
  -D HAS_LNA_CONTROL=1
  -D NRF52_POWER_MANAGEMENT
  -D P_LORA_DIO_1=21
  -D P_LORA_NSS=5
  -D P_LORA_RESET=16
  -D P_LORA_BUSY=19
  -D P_LORA_SCLK=40
  -D P_LORA_MISO=14
  -D P_LORA_MOSI=11
  -D P_LORA_TX_LED=28
  -D P_LORA_PA_POWER=30  ;VFEM_Ctrl -LDO power enable
  -D P_LORA_KCT8103L_PA_CSD=12
  -D P_LORA_KCT8103L_PA_CTX=41
  -D LORA_TX_POWER=9      ; 9dBm + ~13dB KCT8103L gain = ~22dBm output
  -D MAX_LORA_TX_POWER=22 ; Max SX1262 output -> ~28dBm at antenna
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D PIN_VEXT_EN=26   ; Vext is connected to VDD which is also connected to TFT & GPS
  -D PIN_VEXT_EN_ACTIVE=HIGH
  -D PIN_GPS_RX=25
  -D PIN_GPS_TX=23
  -D PIN_GPS_EN=GPS_EN
  -D PIN_GPS_EN_ACTIVE=LOW
  -D PIN_GPS_RESET=GPS_RESET
  -D PIN_GPS_RESET_ACTIVE=LOW
  -D GPS_BAUD_RATE=115200
  -D PIN_VBAT_READ=BATTERY_PIN
  -D PIN_BAT_CTL=47
  -D DISPLAY_CLASS=ST7735Display
  -D DISPLAY_ROTATION=1
build_src_filter = ${nrf52_base.build_src_filter}
  +<helpers/*.cpp>
  +<helpers/sensors>
  +<../variants/heltec_t096>
  -<../variants/heltec_t096/images.cpp>
  +<helpers/ui/ST7735Display.cpp>
  +<helpers/ui/MomentaryButton.cpp>
lib_deps =
  ${nrf52_base.lib_deps}
  ${sensor_base.lib_deps}
  adafruit/Adafruit ST7735 and ST7789 Library @ ^1.11.0
debug_tool = jlink
upload_protocol = nrfutil

[Heltec_t096_tft]
extends = Heltec_t096
lib_ldf_mode = chain+
board = heltec_t096
board_build.ldscript = boards/nrf52840_s140_v6.ld
build_unflags =
  -D DISPLAY_CLASS=ST7735Display
build_flags =
  ${Heltec_t096.build_flags}
  ${heltec_ui_common.build_flags}
  -I src/heltec
  -D HELTEC_USE_ORLP_ED25519_VERIFY=1
  -D HELTEC_MESH_UI=1
  -D HELTEC_DISPLAY_ST7735=1
  -D ST7735_LVGL_INVERT=0
  -D UI_THEME_MONO=1
  -DHELTEC_LICENSE_BOOT_GATE=0
  -D MOMENTARY_BUTTON_MAX=1
  -D ED25519_NO_SEED
  -D LV_CONF_SKIP=1
  -D LV_COLOR_DEPTH=16
  -D LV_DRAW_COMPLEX=1
  -D LV_MEM_SIZE=73728U
  -D LV_USE_LOG=0
  -D LV_TICK_CUSTOM=1
  -D LV_LAYER_SIMPLE_BUF_SIZE=3200U
  -D LV_SHADOW_CACHE_SIZE=0
  -D LV_GRAD_CACHE_DEF_SIZE=0
  -D LV_USE_GRID=0
  -D LV_USE_ANIMIMG=0
  -D LV_USE_THEME_DEFAULT=0
  -D LV_USE_THEME_BASIC=0
  -D LV_USE_THEME_MONO=1
  -D LV_BUILD_EXAMPLES=0
  -D LV_USE_DEMO_WIDGETS=0
  -D LV_USE_DEMO_KEYPAD_AND_ENCODER=0
  -D LV_USE_DEMO_BENCHMARK=0
  -D LV_USE_DEMO_STRESS=0
  -D LV_USE_DEMO_MUSIC=0
  -D LV_USE_KEYBOARD=1
  -D LV_USE_TEXTAREA=1
  -D LV_USE_ARC=0
  -D LV_USE_BAR=0
  -D LV_USE_CALENDAR=0
  -D LV_USE_CALENDAR_HEADER_ARROW=0
  -D LV_USE_CALENDAR_HEADER_DROPDOWN=0
  -D LV_USE_CANVAS=0
  -D LV_USE_CHART=0
  -D LV_USE_CHECKBOX=0
  -D LV_USE_ROLLER=0
  -D LV_USE_LED=0
  -D LV_USE_LIST=0
  -D LV_USE_MENU=1
  -D LV_USE_METER=0
  -D LV_USE_MSGBOX=0
  -D LV_USE_SLIDER=0
  -D LV_USE_SPAN=0
  -D LV_USE_SPINBOX=0
  -D LV_USE_SPINNER=0
  -D LV_USE_TABLE=0
  -D LV_USE_TABVIEW=0
  -D LV_USE_WIN=0
  -D LV_SPRINTF_USE_FLOAT=0
  -D PREVIEW_AUTO_DISMISS_MS=15000
  -D LV_FONT_MONTSERRAT_10=0
  -D LV_FONT_ARIAL_10=1
  -D LV_FONT_CUSTOM_DECLARE=LV_FONT_DECLARE(lv_font_arial_10)
  '-D LV_FONT_DEFAULT=&lv_font_arial_10'
  -fpermissive
build_src_filter = ${Heltec_t096.build_src_filter}
  -<Identity.cpp>
  +<heltec/crypto/Identity.cpp>
  -<helpers/ui/ST7735Display.cpp>
  -<helpers/ui/MomentaryButton.cpp>
  +<heltec/app/*.cpp>
  -<heltec/app/mesh_app_ui_map.cpp>
  -<heltec/app/map_geo.cpp>
  +<heltec/config/*.cpp>
  +<heltec/ui/*.cpp>
  +<heltec/ui/**/*.cpp>
  -<heltec/ui/theme/ui_theme_pixel.cpp>
  -<heltec/ui/map/*.cpp>
  +<../variants/heltec_t096/images.cpp>
  +<heltec/drivers/display/display_port.cpp>
  +<heltec/drivers/display/st7735_port.cpp>
  +<heltec/drivers/input/key_input.cpp>
  +<heltec/drivers/input/momentary_button.cpp>
lib_deps =
  ${Heltec_t096.lib_deps}
  densaugeo/base64 @ ~1.4.0
  end2endzone/NonBlockingRTTTL@^1.3.0
  file://lib/lvgl
debug_tool = jlink
upload_protocol = nrfutil

[env:Heltec_t096_repeater]
extends = Heltec_t096
build_src_filter = ${Heltec_t096.build_src_filter}
  +<../examples/simple_repeater>

build_flags =
  ${Heltec_t096.build_flags}
  -D ADVERT_NAME='"Heltec_t096 Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1

[env:Heltec_t096_repeater_bridge_rs232]
extends = Heltec_t096
build_flags =
  ${Heltec_t096.build_flags}
  -D ADVERT_NAME='"RS232 Bridge"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -D WITH_RS232_BRIDGE=Serial2
  -D WITH_RS232_BRIDGE_RX=9
  -D WITH_RS232_BRIDGE_TX=10
;  -D BRIDGE_DEBUG=1
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${Heltec_t096.build_src_filter}
  +<helpers/bridges/RS232Bridge.cpp>
  +<../examples/simple_repeater>

[env:Heltec_t096_room_server]
extends = Heltec_t096
build_src_filter = ${Heltec_t096.build_src_filter}
  +<../examples/simple_room_server>
build_flags =
  ${Heltec_t096.build_flags}
  -D ADVERT_NAME='"Heltec_t096 Room"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ROOM_PASSWORD='"hello"'
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1

[env:Heltec_t096_sensor]
extends = Heltec_t096
build_flags =
  ${Heltec_t096.build_flags}
  -D ADVERT_NAME='"Heltec_t096 Sensor"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ENV_PIN_SDA=PIN_WIRE1_SDA
  -D ENV_PIN_SCL=PIN_WIRE1_SCL
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${Heltec_t096.build_src_filter}
  +<../examples/simple_sensor>
lib_deps =
  ${Heltec_t096.lib_deps}

[env:Heltec_t096_companion_radio_ble]
extends = Heltec_t096_tft
board_build.ldscript = boards/nrf52840_s140_v6_extrafs.ld
board_upload.maximum_size = 712704
build_unflags =
  ${Heltec_t096_tft.build_unflags}
  -D LV_MEM_SIZE=73728U
build_flags =
  ${Heltec_t096_tft.build_flags}
  -D MAX_CONTACTS=150
  -D MAX_GROUP_CHANNELS=32
  -D BLE_PIN_CODE=123456
  -D ENV_INCLUDE_GPS=1   ; enable the GPS page in UI
  -D LV_MEM_SIZE=57344U
  -D HELTEC_LV_MEM_MONITOR=1
  -I include
  -D CFG_TUSB_CONFIG_FILE=\"nrf52_tusb_cdc_config.h\"
;  -D BLE_DEBUG_LOGGING=1
  -D OFFLINE_QUEUE_SIZE=64
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${Heltec_t096_tft.build_src_filter}
  +<helpers/nrf52/*.cpp>
lib_deps =
  ${Heltec_t096_tft.lib_deps}

[env:Heltec_t096_companion_radio_usb]
extends = Heltec_t096_tft
board_build.ldscript = boards/nrf52840_s140_v6_extrafs.ld
board_upload.maximum_size = 712704
build_flags =
  ${Heltec_t096_tft.build_flags}
  -D MAX_CONTACTS=150
  -D MAX_GROUP_CHANNELS=32
;  -D BLE_PIN_CODE=123456
;  -D BLE_DEBUG_LOGGING=1
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${Heltec_t096_tft.build_src_filter}
  +<helpers/nrf52/*.cpp>
lib_deps =
  ${Heltec_t096_tft.lib_deps}

[env:Heltec_t096_kiss_modem]
extends = Heltec_t096
