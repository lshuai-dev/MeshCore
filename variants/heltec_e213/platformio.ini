[env:Heltec_E213_room_server]
extends = Heltec_E213_hw
build_flags =
  ${Heltec_E213_hw.build_flags}
  -D DISPLAY_CLASS=E213Display
  -D ADVERT_NAME='"Heltec E213 Room"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ROOM_PASSWORD='"hello"'
build_src_filter = ${Heltec_E213_hw.build_src_filter}
  +<helpers/ui/E213Display.cpp>
  +<../examples/simple_room_server>
lib_deps =
  ${Heltec_E213_hw.lib_deps}
  ${esp32_ota.lib_deps}
  bakercp/CRC32 @ ^2.0.0

[env:Heltec_E213_kiss_modem]
extends = Heltec_E213_hw
build_src_filter = ${Heltec_E213_hw.build_src_filter}
  +<../examples/kiss_modem/>
