[Heltec_E213_hw]
extends = esp32_base
board = heltec_e213
build_flags =
  ${esp32_base.build_flags}
  -I variants/heltec_e213
  -D Vision_Master_E213
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D P_LORA_DIO_1=14
  -D P_LORA_NSS=8
  -D P_LORA_RESET=12
  -D P_LORA_BUSY=13
  -D P_LORA_SCLK=9
  -D P_LORA_MISO=11
  -D P_LORA_MOSI=10
  -D P_LORA_TX_LED=45
  -D LORA_TX_POWER=22
  -D PIN_USER_BTN=0
  -D PIN_VEXT_EN=18
  -D PIN_VEXT_EN_ACTIVE=HIGH
  -D PIN_VBAT_READ=7
  -D PIN_ADC_CTRL=46
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D PIN_BOARD_SDA=39
  -D PIN_BOARD_SCL=38
  -D DISP_CS=5
  -D DISP_BUSY=1
  -D DISP_DC=2
  -D DISP_RST=3
  -D DISP_SCLK=4
  -D DISP_MOSI=6
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/heltec_e213>
  -<../variants/heltec_e213/images.cpp>
lib_deps =
  ${esp32_base.lib_deps}
  https://github.com/Quency-D/heltec-eink-modules/archive/563dd41fd850a1bc3039b8723da4f3a20fe1c800.zip

[Heltec_E213_base]
extends = Heltec_E213_hw
lib_ldf_mode = chain+
build_flags =
  ${Heltec_E213_hw.build_flags}
  -D HELTEC_MESH_UI=1
  -D LV_CONF_SKIP=1
  -D LV_DRAW_COMPLEX=1
  -D LV_TICK_CUSTOM=1
  -D LV_SHADOW_CACHE_SIZE=0
  -D LV_GRAD_CACHE_DEF_SIZE=0
  -D LV_USE_GRID=0
  -D LV_USE_ANIMIMG=0
  -D LV_BUILD_EXAMPLES=0
  -D LV_USE_KEYBOARD=1
  -D LV_USE_TEXTAREA=1
  -D HELTEC_E213_LVGL=1
  -D HELTEC_DISPLAY_E213=1
  -D UI_EINK_DISPLAY=1
  ;-D HELTEC_LICENSE_BOOT_GATE=0
  -D MOMENTARY_BUTTON_MAX=1
  -D UI_DISPLAY_BACKLIGHT=0
  -D HELTEC_DISPLAY_AUTO_OFF_DEFAULT_SEC=0
  -D AUTO_SHUTDOWN_MILLIVOLTS=3400
  -D LV_COLOR_DEPTH=1
  -D LV_MEM_CUSTOM=1
  -D LV_MEM_CUSTOM_INCLUDE=\"drivers/display/lv_mem_psram.h\"
  -D LV_MEM_CUSTOM_ALLOC=lv_mem_psram_alloc
  -D LV_MEM_CUSTOM_FREE=lv_mem_psram_free
  -D LV_MEM_CUSTOM_REALLOC=lv_mem_psram_realloc
  -D LV_MEM_BUF_MAX_NUM=32
  -D LV_MEMCPY_MEMSET_STD=1
  -D LV_DISP_DEF_REFR_PERIOD=60
  -D LV_USE_LOG=0
  -D LV_LAYER_SIMPLE_BUF_SIZE=4096U
  -D LV_USE_MENU=1
  -D LV_USE_BAR=0
  -D LV_USE_ROLLER=0
  -D LV_USE_SLIDER=0
  -D UI_THEME_MONO=1
  -D LV_USE_THEME_DEFAULT=0
  -D LV_USE_THEME_BASIC=0
  -D LV_USE_THEME_MONO=1
  -D LV_FONT_HELTEC_7=1
  -D LV_FONT_CUSTOM_DECLARE=LV_FONT_DECLARE(lv_font_heltec_7)
  -D LV_FONT_DEFAULT=\&lv_font_heltec_7
  -D LV_USE_DEMO_WIDGETS=0
  -D LV_USE_DEMO_KEYPAD_AND_ENCODER=0
  -D LV_USE_DEMO_BENCHMARK=0
  -D LV_USE_DEMO_STRESS=0
  -D LV_USE_DEMO_MUSIC=0
  -D UI_NAV_RING_ANIM_MS=0
  -D UI_NAV_USE_SCREEN_ICONS=1
  -D UI_INCLUDE_GPS_SCREEN=0
  -D UI_INCLUDE_KEYBOARD_OVERLAY=1
  -D ENV_INCLUDE_GPS=0
  -D ENV_INCLUDE_COMPASS=0
  -D ENV_INCLUDE_MAP=0
  -D HELTEC_TOUCH_INPUT=0
  -D HELTEC_TOUCH_GESTURE_INPUT=0
  -D HELTEC_HAS_TOUCH=0
  -D E213_LVGL_USER_BUTTON_PIN=21
  -D E213_LV_KEY_ESC=27
  -D E213_LV_KEY_ENTER=10
  -D E213_LV_KEY_NEXT=9
  -D E213_LV_KEY_PREV=11
  -D E213_LVGL_FULL_REFRESH_INTERVAL=0
  -D E213_LVGL_STARTUP_FULL_REFRESH=0
  -D E213_LVGL_REFRESH_QUIET_MS=250
  -D E213_LVGL_CRITICAL_REFRESH_MAX_WAIT_MS=800
  -D E213_LVGL_DEFERRED_REFRESH_MAX_WAIT_MS=10000
  -D E213_LVGL_FULL_REFRESH_AREA_PCT=0
  -D E213_LVGL_AUTO_REFRESH=0
  -D LV_USE_ARC=0
  -D LV_USE_CALENDAR=0
  -D LV_USE_CANVAS=0
  -D LV_USE_CHART=0
  -D LV_USE_CHECKBOX=0
  -D LV_USE_LED=0
  -D LV_USE_LIST=0
  -D LV_USE_METER=0
  -D LV_USE_MSGBOX=0
  -D LV_USE_SPAN=0
  -D LV_USE_SPINBOX=0
  -D LV_USE_SPINNER=0
  -D LV_USE_TABLE=0
  -D LV_USE_TABVIEW=0
  -D LV_USE_WIN=0
  -D LV_SPRINTF_USE_FLOAT=0
  -D LV_FONT_MONTSERRAT_10=0
  -I src/heltec
  -D HELTEC_USE_ORLP_ED25519_VERIFY=1
  -D ED25519_NO_SEED
  -fpermissive
build_src_filter = ${Heltec_E213_hw.build_src_filter}
  -<Identity.cpp>
  -<helpers/ui/MomentaryButton.cpp>
  +<heltec/crypto/Identity.cpp>
  +<heltec/drivers/display/lv_mem_psram.cpp>
  +<heltec/drivers/display/display_port.cpp>
  +<heltec/drivers/display/e213_port.cpp>
  +<heltec/drivers/input/key_input.cpp>
  +<heltec/drivers/input/momentary_button.cpp>
  +<heltec/app/*.cpp>
  -<heltec/app/mesh_app_ui_map.cpp>
  -<heltec/app/map_geo.cpp>
  +<heltec/config/*.cpp>
  +<heltec/ui/*.cpp>
  +<heltec/ui/**/*.cpp>
  -<heltec/ui/theme/ui_theme_pixel.cpp>
  -<heltec/ui/map/*.cpp>
  -<heltec/ui/screens/compass_*.cpp>
  -<heltec/ui/screens/find_friend_*.cpp>
  -<heltec/ui/screens/gps_screen.cpp>
  -<heltec/ui/screens/tracker_screen.cpp>
  -<heltec/ui/overlays/calibration_overlay.cpp>
  +<../variants/heltec_e213/images.cpp>
  +<helpers/esp32/*.cpp>
lib_deps =
  ${Heltec_E213_hw.lib_deps}
  densaugeo/base64 @ ~1.4.0
  end2endzone/NonBlockingRTTTL@^1.3.0
  stevemarple/MicroNMEA @ ^2.0.6
  file://lib/lvgl

[env:Heltec_E213_companion_radio_ble]
extends = Heltec_E213_base
build_flags =
  ${Heltec_E213_base.build_flags}
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=256
  -D MESH_DEBUG=1
build_src_filter = ${Heltec_E213_base.build_src_filter}
lib_deps = ${Heltec_E213_base.lib_deps}

[env:Heltec_E213_companion_radio_usb]
extends = Heltec_E213_base
build_flags =
  ${Heltec_E213_base.build_flags}
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
build_src_filter = ${Heltec_E213_base.build_src_filter}
lib_deps = ${Heltec_E213_base.lib_deps}

[env:Heltec_E213_repeater]
extends = Heltec_E213_hw
build_flags =
  ${Heltec_E213_hw.build_flags}
  -D DISPLAY_CLASS=E213Display
  -D ADVERT_NAME='"Heltec E213 Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
build_src_filter = ${Heltec_E213_hw.build_src_filter}
  +<helpers/ui/E213Display.cpp>
  +<../examples/simple_repeater>
lib_deps =
  ${Heltec_E213_hw.lib_deps}
  ${esp32_ota.lib_deps}
  bakercp/CRC32 @ ^2.0.0

