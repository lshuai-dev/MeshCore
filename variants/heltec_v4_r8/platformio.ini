[Heltec_v4_r8]
extends = esp32_base, lvgl_base
lib_ldf_mode = chain+
board = heltec_v4_r8
build_flags =
  ${esp32_base.build_flags}
  ${lvgl_base.build_flags}
  -D LV_MEM_CUSTOM=1
  -D LV_MEM_CUSTOM_INCLUDE=\"drivers/display/LvMemPsram.h\"
  -D LV_MEM_CUSTOM_ALLOC=lv_mem_psram_alloc
  -D LV_MEM_CUSTOM_FREE=lv_mem_psram_free
  -D LV_MEM_CUSTOM_REALLOC=lv_mem_psram_realloc
  -I variants/heltec_v4_r8
  -I src/heltec
  -include variants/heltec_v4_r8/variant.h
  -D HELTEC_UI_BUTTON_COUNT=2
  -D LV_USE_BAR=0
  -D LV_USE_COLORWHEEL=0
  -D LV_USE_LINE=0
  -D LV_USE_SLIDER=0
  -D LV_FONT_MONTSERRAT_10=0
build_src_filter = ${esp32_base.build_src_filter} ${lvgl_base.build_src_filter} +<heltec/drivers/display/LvMemPsram.cpp>
  +<../variants/heltec_v4_r8>
  +<helpers/sensors>
  +<helpers/esp32/*.cpp>
lib_deps =
  ${esp32_base.lib_deps}
  ${sensor_base.lib_deps}
  ${lvgl_base.lib_deps}

[heltec_v4_r8_oled]
extends = Heltec_v4_r8
build_flags =
  ${Heltec_v4_r8.build_flags}
  ${lvgl_theme_mono.build_flags}
  -D HELTEC_V4_R8_OLED
  -D LV_DISP_DEF_REFR_PERIOD=33
  -D LV_INDEV_DEF_READ_PERIOD=20
  -D LV_LAYER_SIMPLE_BUF_SIZE=3200U
  -D LV_USE_ROLLER=0
build_src_filter = ${Heltec_v4_r8.build_src_filter} ${lvgl_theme_mono.build_src_filter}
  +<heltec/drivers/display/Ssd1306Port.cpp>
  -<heltec/app/MeshAppUiMap.cpp>
  -<heltec/app/MapGeo.cpp>
  -<heltec/ui/theme/ThemePixel.cpp>
  -<heltec/ui/map/*.cpp>
lib_deps =
  ${Heltec_v4_r8.lib_deps}
  adafruit/Adafruit SSD1306 @ ^2.5.15

[heltec_v4_r8_tft]
extends = Heltec_v4_r8
build_flags =
  ${Heltec_v4_r8.build_flags}
  -D LV_COLOR_DEPTH=16
  -D LV_USE_THEME_MONO=0
  -D LV_USE_THEME_DEFAULT=0
  -D LV_USE_THEME_BASIC=0
  -D HELTEC_V4_R8_TFT
  -D HELTEC_SENSOR_MANAGER=1
  '-D HELTEC_UI_INPUT_CAPS=(HELTEC_UI_INPUT_KEY|HELTEC_UI_INPUT_TOUCH)'
  -D ENV_INCLUDE_GPS=1
  -D GPS_L76K=1
  -D HELTEC_TOUCH_USE_CHSC6X=1
  -D HELTEC_TOUCH_GESTURE=1
  -D HELTEC_TOUCH_GESTURE_SWIPE_PX=24
  -D HELTEC_TOUCH_GESTURE_DBL_MS=350
  -D HELTEC_TOUCH_GESTURE_DBL_DIST_PX=20
  -D HELTEC_TOUCH_GESTURE_LONG_MS=1000
  -D HELTEC_TOUCH_EDGE_PX=28
  -D HELTEC_TOUCH_ACTION_EDGE_PX=24
  -D HELTEC_TOUCH_TOP_ACTION_SIDE_MARGIN_PCT=10
  -D ENV_INCLUDE_MAP=1
  -D HELTEC_GEOFENCE=1
  -D MAP_UI_PAN_START_PX=6
  -D MAP_UI_PNG_LOADS_PER_TICK=1
  -D MAP_UI_SD_SPI_MAX_HZ=40000000U
  -D LV_USE_PNG=1
  -D LV_COLOR_16_SWAP=1
  -D LV_COLOR_SCREEN_TRANSP=1
  -D LV_MEM_BUF_MAX_NUM=32
  -D LV_DISP_DEF_REFR_PERIOD=16
  -D LV_INDEV_DEF_READ_PERIOD=16
  -D LV_CIRCLE_CACHE_SIZE=8
  -D LV_LAYER_SIMPLE_BUF_SIZE=24000U
  -D LV_LAYER_SIMPLE_FALLBACK_BUF_SIZE=8192U
  -D LV_IMG_CACHE_DEF_SIZE=12
  -D LODEPNG_NO_COMPILE_ENCODER=1
  -D LODEPNG_NO_COMPILE_ANCILLARY_CHUNKS=1
  -D LV_USE_MENU=0
  -D LV_USE_ROLLER=1
  -D LV_FONT_MONTSERRAT_12=1
  -D LV_FONT_MONTSERRAT_14=1
  '-D LV_FONT_DEFAULT=&lv_font_montserrat_12'
build_src_filter = ${Heltec_v4_r8.build_src_filter}
  -<helpers/sensors/EnvironmentSensorManager.cpp>
  +<heltec/app/MeshAppUiMap.cpp>
  +<heltec/app/MapGeo.cpp>
  +<heltec/drivers/display/St7789Port.cpp>
  +<heltec/drivers/input/TouchInput.cpp>
  +<heltec/drivers/input/TouchGestureInput.cpp>
  +<heltec/drivers/input/TouchPort.cpp>
  +<heltec/sensors/*.cpp>
  +<heltec/sensors/*.c>
  +<heltec/ui/map/*.cpp>
  +<helpers/ui/buzzer.cpp>
  -<heltec/sensors/IcmCompassProvider.cpp>
  -<heltec/sensors/MemsicStackChkShim.c>
  -<heltec/ui/overlays/CalibrationOverlay.cpp>
  -<heltec/ui/screens/CompassScreen.cpp>
  -<heltec/app/MeshAppUiCompass.cpp>
lib_deps =
  ${Heltec_v4_r8.lib_deps}
  file://lib/chsc6x
  greiman/SdFat@^2.2.3

[env:heltec_v4_r8_repeater]
extends = heltec_v4_r8_oled
build_flags =
  ${heltec_v4_r8_oled.build_flags}
  -D ADVERT_NAME='"Heltec R8 Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
build_src_filter = ${heltec_v4_r8_oled.build_src_filter}
lib_deps =
  ${heltec_v4_r8_oled.lib_deps}
  ${esp32_ota.lib_deps}
  bakercp/CRC32 @ ^2.0.0

[env:heltec_v4_r8_room_server]
extends = heltec_v4_r8_oled
build_flags =
  ${heltec_v4_r8_oled.build_flags}
  -D ADVERT_NAME='"Heltec R8 Room"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ROOM_PASSWORD='"hello"'
build_src_filter = ${heltec_v4_r8_oled.build_src_filter}
lib_deps =
  ${heltec_v4_r8_oled.lib_deps}
  ${esp32_ota.lib_deps}

[env:heltec_v4_r8_terminal_chat]
extends = heltec_v4_r8_oled, terminal_base
build_flags =
  ${heltec_v4_r8_oled.build_flags}
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=1
build_src_filter = ${heltec_v4_r8_oled.build_src_filter}
lib_deps =
  ${heltec_v4_r8_oled.lib_deps}

[env:heltec_v4_r8_companion_radio_usb]
extends = heltec_v4_r8_oled, companion_base
build_flags =
  ${heltec_v4_r8_oled.build_flags}
build_src_filter = ${heltec_v4_r8_oled.build_src_filter}
lib_deps =
  ${heltec_v4_r8_oled.lib_deps}

[env:heltec_v4_r8_companion_radio_ble]
extends = heltec_v4_r8_oled, companion_base
build_flags =
  ${heltec_v4_r8_oled.build_flags}
  -D OFFLINE_QUEUE_SIZE=128
  -D BLE_PIN_CODE=123456
  -D AUTO_SHUTDOWN_MILLIVOLTS=3400
  -D BLE_DEBUG_LOGGING=1
build_src_filter = ${heltec_v4_r8_oled.build_src_filter}
lib_deps =
  ${heltec_v4_r8_oled.lib_deps}

[env:heltec_v4_r8_companion_radio_wifi]
extends = heltec_v4_r8_oled, companion_base
build_flags =
  ${heltec_v4_r8_oled.build_flags}
  -D WIFI_DEBUG_LOGGING=1
  -D WIFI_SSID='"myssid"'
  -D WIFI_PWD='"mypwd"'
build_src_filter = ${heltec_v4_r8_oled.build_src_filter}
lib_deps =
  ${heltec_v4_r8_oled.lib_deps}

