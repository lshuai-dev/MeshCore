build_unflags =
  -D MAX_GROUP_CHANNELS=40
build_flags =
  ${heltec_v4_r8_tft.build_flags}
  -D MAX_GROUP_CHANNELS=42
  -D OFFLINE_QUEUE_SIZE=128
  ;-D MESH_DEBUG=1
build_src_filter = ${heltec_v4_r8_tft.build_src_filter}
lib_deps =
