[Heltec_v4_r8]
extends = esp32_base
lib_ldf_mode = chain+
board = heltec_v4_r8
build_flags =
  ${esp32_base.build_flags}
  ${heltec_ui_common.build_flags}
  ${sensor_base.build_flags}
  -I variants/heltec_v4_r8
  -I src/heltec
  -include variants/heltec_v4_r8/variant.h
  -D HELTEC_V4_R8
  -D USE_SX1262
  -D HELTEC_USE_ORLP_ED25519_VERIFY=1
  -D HELTEC_MESH_UI=1
  -D HAS_LNA_CONTROL=1
  -D ED25519_NO_SEED
  -D MOMENTARY_BUTTON_MAX=2
  -D HELTEC_BUTTON_MAX_CLICKS=3
  -D LV_CONF_SKIP=1
  -D LV_MEM_CUSTOM=1
  -D LV_MEM_CUSTOM_INCLUDE=\"drivers/display/lv_mem_psram.h\"
  -D LV_MEM_CUSTOM_ALLOC=lv_mem_psram_alloc
  -D LV_MEM_CUSTOM_FREE=lv_mem_psram_free
  -D LV_MEM_CUSTOM_REALLOC=lv_mem_psram_realloc
  -D LV_MEMCPY_MEMSET_STD=1
  -D LV_SHADOW_CACHE_SIZE=0
  -D LV_GRAD_CACHE_DEF_SIZE=0
  -D LV_USE_GRID=0
  -D LV_USE_ANIMIMG=0
  -D LV_TICK_CUSTOM=1
  -D LV_DRAW_COMPLEX=1
  -D LV_BUILD_EXAMPLES=0
  -D LV_USE_KEYBOARD=1
  -D LV_USE_TEXTAREA=1
  -D LV_USE_ARC=0
  -D LV_USE_BAR=0
  -D LV_USE_CALENDAR=0
  -D LV_USE_CANVAS=0
  -D LV_USE_CHART=0
  -D LV_USE_CHECKBOX=0
  -D LV_USE_COLORWHEEL=0
  -D LV_USE_LED=0
  -D LV_USE_LINE=0
  -D LV_USE_LIST=0
  -D LV_USE_MENU=1
  -D LV_USE_METER=0
  -D LV_USE_MSGBOX=0
  -D LV_USE_ROLLER=0
  -D LV_USE_SLIDER=0
  -D LV_USE_SPAN=0
  -D LV_USE_SPINBOX=0
  -D LV_USE_SPINNER=0
  -D LV_USE_TABLE=0
  -D LV_USE_TABVIEW=0
  -D LV_USE_WIN=0
  -D LV_SPRINTF_USE_FLOAT=0
  -D LV_FONT_MONTSERRAT_10=0
  -D PREVIEW_AUTO_DISMISS_MS=15000
  -fpermissive
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/heltec_v4_r8>
  +<helpers/sensors>
  -<Identity.cpp>
  -<helpers/ui/MomentaryButton.cpp>
  +<heltec/crypto/Identity.cpp>
  +<heltec/drivers/display/display_port.cpp>
  +<heltec/drivers/display/lv_mem_psram.cpp>
  +<heltec/drivers/input/key_input.cpp>
  +<heltec/drivers/input/momentary_button.cpp>
  +<heltec/app/*.cpp>
  +<heltec/config/*.cpp>
  +<heltec/ui/*.cpp>
  +<heltec/ui/**/*.cpp>
  +<helpers/esp32/*.cpp>
lib_deps =
  ${esp32_base.lib_deps}
  ${sensor_base.lib_deps}
  densaugeo/base64 @ ~1.4.0
  end2endzone/NonBlockingRTTTL@^1.3.0
  file://lib/lvgl

[heltec_v4_r8_oled]
extends = Heltec_v4_r8
build_flags =
  ${Heltec_v4_r8.build_flags}
  -D MOMENTARY_BUTTON_MAX=2
  -D HELTEC_V4_R8_OLED
  -D HELTEC_DISPLAY_SSD1306=1
  -D UI_THEME_MONO=1
  -D LV_COLOR_DEPTH=1
  -D LV_MEM_BUF_MAX_NUM=16
  -D LV_DISP_DEF_REFR_PERIOD=33
  -D LV_INDEV_DEF_READ_PERIOD=20
  -D LV_LAYER_SIMPLE_BUF_SIZE=3200U
  -D LV_USE_THEME_DEFAULT=0
  -D LV_USE_THEME_BASIC=0
  -D LV_USE_THEME_MONO=1
  -D LV_FONT_HELTEC_7=1
  -D LV_FONT_CUSTOM_DECLARE=LV_FONT_DECLARE(lv_font_heltec_7)
  '-D LV_FONT_DEFAULT=&lv_font_heltec_7'
build_src_filter = ${Heltec_v4_r8.build_src_filter}
  +<heltec/drivers/display/ssd1306_port.cpp>
  -<heltec/app/mesh_app_ui_map.cpp>
  -<heltec/app/map_geo.cpp>
  -<heltec/ui/theme/ui_theme_pixel.cpp>
  -<heltec/ui/map/*.cpp>
lib_deps =
  ${Heltec_v4_r8.lib_deps}
  adafruit/Adafruit SSD1306 @ ^2.5.15

[heltec_v4_r8_tft]
extends = Heltec_v4_r8
build_unflags =
  -D LV_USE_ROLLER=0
  -D LV_USE_MENU=1
build_flags =
  ${Heltec_v4_r8.build_flags}
  -D HELTEC_V4_R8_TFT
  -D HELTEC_SENSOR_MANAGER=1
  -D HELTEC_DISPLAY_ST7789=1
  -D UI_THEME_COLOR=1
  -D UI_NAVIGATION_GRID=1
  -D UI_NAV_USE_SCREEN_ICONS=1
  -D HELTEC_HAS_TOUCH=1
  -D HELTEC_TOUCH_USE_CHSC6X=1
  -D HELTEC_TOUCH_GESTURE_INPUT=1
  -D HELTEC_TOUCH_GESTURE_SWIPE_PX=24
  -D HELTEC_TOUCH_GESTURE_AXIS_MARGIN_PX=10
  -D HELTEC_TOUCH_GESTURE_DBL_MS=350
  -D HELTEC_TOUCH_GESTURE_DBL_DIST_PX=20
  -D HELTEC_TOUCH_GESTURE_LONG_MS=1000
  -D HELTEC_TOUCH_EDGE_PX=28
  -D HELTEC_TOUCH_ACTION_EDGE_PX=24
  -D HELTEC_TOUCH_TOP_ACTION_SIDE_MARGIN_PCT=10
  -D ENV_INCLUDE_MAP=1
  -D HELTEC_MAP_TOUCH_PAN=1
  -D MAP_UI_PAN_START_PX=6
  -D MAP_UI_PNG_LOADS_PER_TICK=1
  -D ENV_SKIP_GPS_DETECT=1
  -D SDFAT_FILE_TYPE=3
  -D HELTEC_SD_BUS_PRECONFIGURED=1
  -D HELTEC_TOPBAR_TOUCH_SHELL=1
  -D LV_USE_PNG=1
  -D LV_USE_FS_STDIO=0
  -D LV_COLOR_DEPTH=16
  -D LV_COLOR_16_SWAP=1
  -D LV_COLOR_SCREEN_TRANSP=1
  -D LV_MEM_BUF_MAX_NUM=32
  -D LV_DISP_DEF_REFR_PERIOD=16
  -D LV_INDEV_DEF_READ_PERIOD=16
  -D LV_SHADOW_CACHE_SIZE=0
  -D LV_CIRCLE_CACHE_SIZE=8
  -D LV_LAYER_SIMPLE_BUF_SIZE=24000U
  -D LV_LAYER_SIMPLE_FALLBACK_BUF_SIZE=8192U
  -D LV_IMG_CACHE_DEF_SIZE=12
  -D LV_GRAD_CACHE_DEF_SIZE=0
  -D LV_USE_THEME_DEFAULT=0
  -D LV_USE_GRID=0
  -D LV_USE_ANIMIMG=0
  -D LODEPNG_NO_COMPILE_ENCODER
  -D LODEPNG_NO_COMPILE_ANCILLARY_CHUNKS
  -D LV_USE_THEME_MONO=0
  -D LV_USE_MENU=0
  -D LV_USE_ROLLER=1
  -D LV_FONT_MONTSERRAT_10=0
  -D LV_FONT_MONTSERRAT_12=1
  -D LV_FONT_MONTSERRAT_14=1
  ;-D LV_FONT_CUSTOM_DECLARE=LV_FONT_DECLARE(lv_font_montserrat_12)
  '-D LV_FONT_DEFAULT=&lv_font_montserrat_12'
build_src_filter = ${Heltec_v4_r8.build_src_filter}
  -<helpers/sensors/EnvironmentSensorManager.cpp>
  +<heltec/drivers/display/st7789_port.cpp>
  +<heltec/drivers/input/touch_input.cpp>
  +<heltec/drivers/input/touch_gesture_input.cpp>
  +<heltec/drivers/input/touch_port.cpp>
  +<heltec/sensors/*.cpp>
  +<heltec/sensors/*.c>
  +<helpers/ui/buzzer.cpp>
  -<heltec/sensors/ICMCompassProvider.cpp>
  -<heltec/sensors/memsic_stack_chk_shim.c>
  -<heltec/ui/widgets/calibration_overlay.cpp>
  -<heltec/ui/screens/compass_screen.cpp>
  -<heltec/ui/screens/find_friend_screen.cpp>
  -<heltec/app/mesh_app_ui_compass.cpp>
lib_deps =
  ${Heltec_v4_r8.lib_deps}
  file://lib/chsc6x
  greiman/SdFat@^2.2.3

[env:heltec_v4_r8_repeater]
extends = heltec_v4_r8_oled
build_flags =
  ${heltec_v4_r8_oled.build_flags}
  -D ADVERT_NAME='"Heltec R8 Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
build_src_filter = ${heltec_v4_r8_oled.build_src_filter}
lib_deps =
  ${heltec_v4_r8_oled.lib_deps}
  ${esp32_ota.lib_deps}
  bakercp/CRC32 @ ^2.0.0

[env:heltec_v4_r8_room_server]
extends = heltec_v4_r8_oled
build_flags =
  ${heltec_v4_r8_oled.build_flags}
  -D ADVERT_NAME='"Heltec R8 Room"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ROOM_PASSWORD='"hello"'
build_src_filter = ${heltec_v4_r8_oled.build_src_filter}
lib_deps =
  ${heltec_v4_r8_oled.lib_deps}
  ${esp32_ota.lib_deps}

[env:heltec_v4_r8_terminal_chat]
extends = heltec_v4_r8_oled
build_flags =
  ${heltec_v4_r8_oled.build_flags}
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=1
build_src_filter = ${heltec_v4_r8_oled.build_src_filter}
lib_deps =
  ${heltec_v4_r8_oled.lib_deps}

[env:heltec_v4_r8_companion_radio_usb]
extends = heltec_v4_r8_oled
build_flags =
  ${heltec_v4_r8_oled.build_flags}
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=128
build_src_filter = ${heltec_v4_r8_oled.build_src_filter}
lib_deps =
  ${heltec_v4_r8_oled.lib_deps}

[env:heltec_v4_r8_companion_radio_ble]
extends = heltec_v4_r8_oled
build_flags =
  ${heltec_v4_r8_oled.build_flags}
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=128
  -D BLE_PIN_CODE=123456
  -D AUTO_SHUTDOWN_MILLIVOLTS=3400
  -D BLE_DEBUG_LOGGING=1
build_src_filter = ${heltec_v4_r8_oled.build_src_filter}
lib_deps =
  ${heltec_v4_r8_oled.lib_deps}

[env:heltec_v4_r8_companion_radio_wifi]
