  ; RELEASE_DISABLED: -D MESH_DEBUG=1
  -D GPS_NMEA_DEBUG=1
build_src_filter = ${heltec_v4_oled.build_src_filter}
  -<helpers/ui/MomentaryButton.cpp>
  +<heltec/app/*.cpp>
  -<heltec/app/MeshAppUiMap.cpp>
  -<heltec/app/MapGeo.cpp>
