[Heltec_lora32_v4]
extends = esp32_base
board = heltec_v4
build_flags =
  ${esp32_base.build_flags}
  ${sensor_base.build_flags}
  -I variants/heltec_v4
  -I src/heltec
  -D HELTEC_LORA_V4
  -D USE_SX1262
  -D ESP32_CPU_FREQ=80
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D P_LORA_TX_LED=35
  -D P_LORA_DIO_1=14
  -D P_LORA_NSS=8
  -D P_LORA_RESET=12
  -D P_LORA_BUSY=13
  -D P_LORA_SCLK=9
  -D P_LORA_MISO=11
  -D P_LORA_MOSI=10
  -D P_LORA_PA_POWER=7  ; // VFEM_Ctrl -LDO power enable
  -D P_LORA_GC1109_PA_EN=2    ; // CSD - GC1109 chip enable (HIGH=on)
  -D P_LORA_GC1109_PA_TX_EN=46 ;// CPS - GC1109 PA mode (HIGH=full PA, LOW=bypass)
  -D P_LORA_KCT8103L_PA_CSD=2
  -D P_LORA_KCT8103L_PA_CTX=5
  -D PIN_USER_BTN=0
  -D PIN_VEXT_EN=36
  -D PIN_VEXT_EN_ACTIVE=LOW
  -D LORA_TX_POWER=10 ;If it is configured as 10 here, the final output will be 22 dbm.
  -D MAX_LORA_TX_POWER=22 ; Max SX1262 output
  -D SX126X_REGISTER_PATCH=1       ; Patch register 0x8B5 for improved RX
  -D SX126X_DIO2_AS_RF_SWITCH=true ; GC1109 CTX is controlled by SX1262 DIO2
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1      ; In some cases, commenting this out will improve RX
  -D PIN_GPS_RX=38
  -D PIN_GPS_TX=39
  -D GPS_L76K
  -D PIN_GPS_RESET=42
  -D PIN_GPS_RESET_ACTIVE=LOW
  -D PIN_GPS_EN=34
  -D PIN_GPS_EN_ACTIVE=LOW
  -D ENV_INCLUDE_GPS=1
  -D PIN_ADC_CTRL=37
  -D PIN_VBAT_READ=1
  -D HELTEC_SENSOR_MANAGER=1
  -D HAS_LNA_CONTROL=1
  -D AUTO_SHUTDOWN_MILLIVOLTS=3400
  -fpermissive

build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/heltec_v4>
  -<../variants/heltec_v4/Images.cpp>
  +<heltec/sensors/*.cpp>
  +<heltec/sensors/*.c>
  +<helpers/esp32/*.cpp>
  +<helpers/sensors>
  -<helpers/sensors/EnvironmentSensorManager.cpp>

lib_deps =
  ${esp32_base.lib_deps}
  ${sensor_base.lib_deps}

[heltec_v4_lvgl]
extends = Heltec_lora32_v4, lvgl_base
lib_ldf_mode = chain+
build_flags =
  ${Heltec_lora32_v4.build_flags}
  ${lvgl_base.build_flags}
  -D LV_MEM_CUSTOM=1
  -D LV_MEM_CUSTOM_INCLUDE=\"drivers/display/LvMemPsram.h\"
  -D LV_MEM_CUSTOM_ALLOC=lv_mem_psram_alloc
  -D LV_MEM_CUSTOM_FREE=lv_mem_psram_free
  -D LV_MEM_CUSTOM_REALLOC=lv_mem_psram_realloc
  -D LV_USE_BAR=0
  -D LV_USE_COLORWHEEL=0
  -D LV_USE_SLIDER=0
build_src_filter = ${Heltec_lora32_v4.build_src_filter} ${lvgl_base.build_src_filter} +<heltec/drivers/display/LvMemPsram.cpp>
  +<../variants/heltec_v4/Images.cpp>
lib_deps =
  ${Heltec_lora32_v4.lib_deps}
  ${lvgl_base.lib_deps}

[heltec_v4_oled]
extends = heltec_v4_lvgl
build_flags =
  ${heltec_v4_lvgl.build_flags}
  ${lvgl_theme_mono.build_flags}
  -D HELTEC_LORA_V4_OLED
  -D PIN_BOARD_SDA=17
  -D PIN_BOARD_SCL=18
  -D PIN_OLED_RESET=21
  -D LV_FONT_MONTSERRAT_10=0

build_src_filter= ${heltec_v4_lvgl.build_src_filter} ${lvgl_theme_mono.build_src_filter}
  +<heltec/drivers/display/Ssd1306Port.cpp>
  +<heltec/drivers/input/KeyInput.cpp>
  +<heltec/drivers/input/MomentaryButton.cpp>
  -<heltec/app/MeshAppUiMap.cpp>
  -<heltec/app/MapGeo.cpp>
  -<heltec/ui/theme/ThemePixel.cpp>
  -<heltec/ui/map/*.cpp>
lib_deps = ${heltec_v4_lvgl.lib_deps}

[heltec_v4_tft]
extends = heltec_v4_lvgl
build_flags =
  ${heltec_v4_lvgl.build_flags}
  -D LV_COLOR_DEPTH=16
  -D LV_USE_THEME_MONO=0
  -D LV_USE_THEME_DEFAULT=0
  -D LV_USE_THEME_BASIC=0
  -I src/heltec
  -D HELTEC_LORA_V4_TFT
  -D SPI_INTERFACES_COUNT=2
  -D PIN_SPI1_SCK=17
  -D PIN_SPI1_MOSI=33
  -D PIN_SPI1_MISO=-1
  -D PIN_BOARD_SDA=4
  -D PIN_BOARD_SCL=3
  -D PIN_TFT_RST=18
  -D PIN_TFT_VDD_CTL=-1
  -D PIN_TFT_LEDA_CTL=21
  -D PIN_TFT_LEDA_CTL_ACTIVE=HIGH
  -D PIN_TFT_CS=15
  -D PIN_TFT_DC=16
  -D PIN_TFT_SCL=17
  -D PIN_TFT_SDA=33
  -D LV_COLOR_16_SWAP=1
  -D LV_FONT_MONTSERRAT_12=1
  '-D LV_FONT_DEFAULT=&lv_font_montserrat_12'
build_src_filter= ${heltec_v4_lvgl.build_src_filter}
  +<heltec/drivers/display/St7789Port.cpp>
  +<heltec/drivers/input/KeyInput.cpp>
  +<heltec/drivers/input/MomentaryButton.cpp>
lib_deps =
  ${heltec_v4_lvgl.lib_deps}

[heltec_v4_legacy_oled]
extends = Heltec_lora32_v4
lib_ignore = Networking, lvgl
build_flags =
  ${Heltec_lora32_v4.build_flags}
  -D HELTEC_LORA_V4_OLED
  -D DISPLAY_CLASS=SSD1306Display
  -D PIN_BOARD_SDA=17
  -D PIN_BOARD_SCL=18
  -D PIN_OLED_RESET=21
build_src_filter = ${Heltec_lora32_v4.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
lib_deps = ${Heltec_lora32_v4.lib_deps}

[heltec_v4_legacy_tft]
extends = Heltec_lora32_v4
lib_ignore = Networking, lvgl
build_flags =
  ${Heltec_lora32_v4.build_flags}
  -D HELTEC_LORA_V4_TFT
  -D DISPLAY_CLASS=ST7789LCDDisplay
  -D SPI_INTERFACES_COUNT=2
  -D PIN_SPI1_SCK=17
  -D PIN_SPI1_MOSI=33
  -D PIN_SPI1_MISO=-1
  -D PIN_BOARD_SDA=4
  -D PIN_BOARD_SCL=3
  -D PIN_TFT_RST=18
  -D PIN_TFT_VDD_CTL=-1
  -D PIN_TFT_LEDA_CTL=21
  -D PIN_TFT_LEDA_CTL_ACTIVE=HIGH
  -D PIN_TFT_CS=15
  -D PIN_TFT_DC=16
  -D PIN_TFT_SCL=17
  -D PIN_TFT_SDA=33
build_src_filter = ${Heltec_lora32_v4.build_src_filter}
  +<helpers/ui/ST7789LCDDisplay.cpp>
lib_deps = ${Heltec_lora32_v4.lib_deps}

[env:heltec_v4_repeater]
extends = heltec_v4_legacy_oled
build_flags =
  ${heltec_v4_legacy_oled.build_flags}
  -D ADVERT_NAME='"Heltec Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${heltec_v4_legacy_oled.build_src_filter}
  +<../examples/simple_repeater>
lib_deps =
  ${heltec_v4_legacy_oled.lib_deps}
  ${esp32_ota.lib_deps}
  bakercp/CRC32 @ ^2.0.0

