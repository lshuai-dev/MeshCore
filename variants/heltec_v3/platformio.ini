[Heltec_lora32_v3]
extends = esp32_base
lib_ldf_mode = chain+
board = esp32-s3-devkitc-1
build_flags =
  ${esp32_base.build_flags}
  ${sensor_base.build_flags}
  -I variants/heltec_v3
  -I src/heltec
  -D HELTEC_LORA_V3
  -D ESP32_CPU_FREQ=80
  -D HELTEC_LICENSE_BOOT_GATE=0
  -D P_LORA_DIO_1=14
  -D P_LORA_NSS=8
  -D P_LORA_RESET=RADIOLIB_NC
  -D P_LORA_BUSY=13
  -D P_LORA_SCLK=9
  -D P_LORA_MISO=11
  -D P_LORA_MOSI=10
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=22
  -D P_LORA_TX_LED=35
  -D PIN_BOARD_SDA=17
  -D PIN_BOARD_SCL=18
  -D PIN_USER_BTN=0
  -D PIN_VEXT_EN=36
  -D PIN_OLED_RESET=21
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D PIN_GPS_RX=47
  -D PIN_GPS_TX=48
  -D PIN_GPS_EN=26
  -D HELTEC_USE_ORLP_ED25519_VERIFY=1
  -D HELTEC_MESH_UI=1
  -D ED25519_NO_SEED
  -D LV_CONF_SKIP=1
  -D LV_DRAW_COMPLEX=1
  -D LV_MEM_CUSTOM=1
  -D LV_MEM_CUSTOM_INCLUDE=\"drivers/display/lv_mem_psram.h\"
  -D LV_MEM_CUSTOM_ALLOC=lv_mem_psram_alloc
  -D LV_MEM_CUSTOM_FREE=lv_mem_psram_free
  -D LV_MEM_CUSTOM_REALLOC=lv_mem_psram_realloc
  -D LV_MEM_BUF_MAX_NUM=32
  -D LV_MEMCPY_MEMSET_STD=1
  -D LV_USE_LOG=0
  -D LV_TICK_CUSTOM=1
  -D LV_LAYER_SIMPLE_BUF_SIZE=3200U
  -D LV_SHADOW_CACHE_SIZE=0
  -D LV_GRAD_CACHE_DEF_SIZE=0
  -D LV_USE_GRID=0
  -D LV_USE_ANIMIMG=0
  -D LV_BUILD_EXAMPLES=0
  -D LV_USE_DEMO_WIDGETS=0
  -D LV_USE_DEMO_KEYPAD_AND_ENCODER=0
  -D LV_USE_DEMO_BENCHMARK=0
  -D LV_USE_DEMO_STRESS=0
  -D LV_USE_DEMO_MUSIC=0
  -D LV_USE_KEYBOARD=1
  -D LV_USE_TEXTAREA=1
  -D LV_USE_ARC=0
  -D LV_USE_BAR=0
  -D LV_USE_CALENDAR=0
  -D LV_USE_CALENDAR_HEADER_ARROW=0
  -D LV_USE_CALENDAR_HEADER_DROPDOWN=0
  -D LV_USE_CANVAS=0
  -D LV_USE_CHART=0
  -D LV_USE_CHECKBOX=0
  -D LV_USE_ROLLER=0
  -D LV_USE_LED=0
  -D LV_USE_LIST=0
  -D LV_USE_MENU=1
  -D LV_USE_METER=0
  -D LV_USE_MSGBOX=0
  -D LV_USE_SLIDER=0
  -D LV_USE_SPAN=0
  -D LV_USE_SPINBOX=0
  -D LV_USE_SPINNER=0
  -D LV_USE_TABLE=0
  -D LV_USE_TABVIEW=0
  -D LV_USE_WIN=0
  -D LV_SPRINTF_USE_FLOAT=0
  -D AUTO_SHUTDOWN_MILLIVOLTS=3400
  -D PREVIEW_AUTO_DISMISS_MS=15000
  -fpermissive
build_src_filter = ${esp32_base.build_src_filter}
  -<Identity.cpp>
  +<heltec/crypto/Identity.cpp>
  +<heltec/drivers/display/lv_mem_psram.cpp>
  +<../variants/heltec_v3>
  -<../variants/heltec_v3/images.cpp>
  -<helpers/ui/MomentaryButton.cpp>
  +<helpers/sensors>
lib_deps =
  ${esp32_base.lib_deps}
  ${sensor_base.lib_deps}

[heltec_v3_oled]
extends = Heltec_lora32_v3
build_flags =
  ${Heltec_lora32_v3.build_flags}
  -D HELTEC_DISPLAY_SSD1306=1
  -D UI_THEME_MONO=1
  -D MOMENTARY_BUTTON_MAX=1
  -D LV_COLOR_DEPTH=1
  -D LV_USE_THEME_DEFAULT=0
  -D LV_USE_THEME_BASIC=0
  -D LV_USE_THEME_MONO=1
  -D LV_FONT_HELTEC_7=1
  -D LV_FONT_CUSTOM_DECLARE=LV_FONT_DECLARE(lv_font_heltec_7)
  '-D LV_FONT_DEFAULT=&lv_font_heltec_7'
build_src_filter = ${Heltec_lora32_v3.build_src_filter}
  +<heltec/drivers/display/display_port.cpp>
  +<heltec/drivers/display/ssd1306_port.cpp>
  +<heltec/drivers/input/key_input.cpp>
  +<heltec/drivers/input/momentary_button.cpp>
  +<heltec/app/*.cpp>
  -<heltec/app/mesh_app_ui_map.cpp>
  -<heltec/app/map_geo.cpp>
  +<heltec/config/*.cpp>
  +<heltec/ui/*.cpp>
  +<heltec/ui/**/*.cpp>
  -<heltec/ui/theme/ui_theme_pixel.cpp>
  -<heltec/ui/map/*.cpp>
  +<../variants/heltec_v3/images.cpp>
  +<helpers/esp32/*.cpp>
lib_deps = ${Heltec_lora32_v3.lib_deps}
  densaugeo/base64 @ ~1.4.0
  end2endzone/NonBlockingRTTTL@^1.3.0
  adafruit/Adafruit SSD1306 @ ^2.5.15
  file://lib/lvgl

[heltec_v3_legacy_oled]
extends = Heltec_lora32_v3
build_flags =
  ${Heltec_lora32_v3.build_flags}
  -D DISPLAY_CLASS=SSD1306Display
build_src_filter = ${Heltec_lora32_v3.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<helpers/ui/MomentaryButton.cpp>
lib_deps =
  ${Heltec_lora32_v3.lib_deps}
  adafruit/Adafruit SSD1306 @ ^2.5.15

[env:Heltec_v3_repeater]
extends = heltec_v3_legacy_oled
build_flags =
  ${heltec_v3_legacy_oled.build_flags}
  -D ADVERT_NAME='"Heltec Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${heltec_v3_legacy_oled.build_src_filter}
  +<../examples/simple_repeater>
lib_deps =
  ${heltec_v3_legacy_oled.lib_deps}
  ${esp32_ota.lib_deps}
  bakercp/CRC32 @ ^2.0.0

[env:Heltec_v3_repeater_bridge_rs232]
extends = heltec_v3_legacy_oled
build_flags =
  ${heltec_v3_legacy_oled.build_flags}
  -D ADVERT_NAME='"RS232 Bridge"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -D WITH_RS232_BRIDGE=Serial2
  -D WITH_RS232_BRIDGE_RX=5
  -D WITH_RS232_BRIDGE_TX=6
;  -D BRIDGE_DEBUG=1
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${heltec_v3_legacy_oled.build_src_filter}
  +<helpers/bridges/RS232Bridge.cpp>
  +<../examples/simple_repeater>
lib_deps =
  ${heltec_v3_legacy_oled.lib_deps}
  ${esp32_ota.lib_deps}

[env:Heltec_v3_repeater_bridge_espnow]
extends = heltec_v3_legacy_oled
build_flags =
  ${heltec_v3_legacy_oled.build_flags}
  -D ADVERT_NAME='"ESPNow Bridge"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -D WITH_ESPNOW_BRIDGE=1
;  -D BRIDGE_DEBUG=1
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${heltec_v3_legacy_oled.build_src_filter}
  +<helpers/bridges/ESPNowBridge.cpp>
  +<../examples/simple_repeater>
lib_deps =
  ${heltec_v3_legacy_oled.lib_deps}
  ${esp32_ota.lib_deps}

[env:Heltec_v3_room_server]
extends = heltec_v3_legacy_oled
build_flags =
  ${heltec_v3_legacy_oled.build_flags}
  -D ADVERT_NAME='"Heltec Room"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ROOM_PASSWORD='"hello"'
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${heltec_v3_legacy_oled.build_src_filter}
  +<../examples/simple_room_server>
lib_deps =
  ${heltec_v3_legacy_oled.lib_deps}
  ${esp32_ota.lib_deps}

[env:Heltec_v3_terminal_chat]
extends = Heltec_lora32_v3
build_flags =
  ${Heltec_lora32_v3.build_flags}
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=1
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${Heltec_lora32_v3.build_src_filter}
  +<../examples/simple_secure_chat/main.cpp>
lib_deps =
  ${Heltec_lora32_v3.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:Heltec_v3_companion_radio_usb]
extends = heltec_v3_oled
build_flags =
  ${heltec_v3_oled.build_flags}
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
; NOTE: DO NOT ENABLE -->  -D MESH_PACKET_LOGGING=1
; NOTE: DO NOT ENABLE -->  -D MESH_DEBUG=1
build_src_filter = ${heltec_v3_oled.build_src_filter}
lib_deps =
  ${heltec_v3_oled.lib_deps}

[env:Heltec_v3_companion_radio_ble]
extends = heltec_v3_oled
build_flags =
  ${heltec_v3_oled.build_flags}
  -I src/heltec
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456   ; dynamic, random PIN
  ; -D BLE_DEBUG_LOGGING=1
  -D OFFLINE_QUEUE_SIZE=256
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${heltec_v3_oled.build_src_filter}
  -<helpers/ui/MomentaryButton.cpp>
  -<heltec/app/mesh_app_ui_map.cpp>
  -<heltec/app/map_geo.cpp>
  -<heltec/ui/theme/ui_theme_pixel.cpp>
  -<heltec/ui/map/*.cpp>
lib_deps =
  ${heltec_v3_oled.lib_deps}

[env:Heltec_v3_companion_radio_wifi]
extends = heltec_v3_oled
build_flags =
  ${heltec_v3_oled.build_flags}
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  ; -D WIFI_DEBUG_LOGGING=1
  -D WIFI_SSID='"myssid"'
  -D WIFI_PWD='"mypwd"'
  -D OFFLINE_QUEUE_SIZE=256
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${heltec_v3_oled.build_src_filter}
lib_deps =
  ${heltec_v3_oled.lib_deps}

[env:Heltec_v3_sensor]
extends = heltec_v3_legacy_oled
build_flags =
  ${heltec_v3_legacy_oled.build_flags}
  -D ADVERT_NAME='"Heltec v3 Sensor"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ENV_PIN_SDA=33
  -D ENV_PIN_SCL=34
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${heltec_v3_legacy_oled.build_src_filter}
  +<../examples/simple_sensor>
lib_deps =
  ${heltec_v3_legacy_oled.lib_deps}
  ${esp32_ota.lib_deps}

