[Heltec_radio_core_base]
lib_ldf_mode = deep+
build_unflags =
  -D ENV_INCLUDE_GPS=1
build_flags =
  -I variants/heltec_radio_core
  -I src/heltec
  -D HELTEC_RADIO_CORE=1
  -D HELTEC_RADIO_CORE_TFT=1
  -D USE_SX1262=1
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=22
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D SX126X_REGISTER_PATCH=1
  -D HELTEC_SENSOR_MANAGER=1
  -D ENV_INCLUDE_GPS=0
  -D RADIOCORE_HAS_NV3001B_DISPLAY=1
  -D RADIOCORE_NV3001B_DC=PIN_TFT_DC
  -D RADIOCORE_NV3001B_CS=PIN_TFT_CS
  -D RADIOCORE_NV3001B_SCK=PIN_TFT_SCL
  -D RADIOCORE_NV3001B_MOSI=PIN_TFT_SDA
  -D RADIOCORE_NV3001B_ENABLE=PIN_TFT_VDD_CTL
  -D RADIOCORE_NV3001B_ENABLE_ACTIVE=PIN_TFT_VDD_CTL_ACTIVE
  -D RADIOCORE_NV3001B_BACKLIGHT=PIN_TFT_LEDA_CTL
  -D RADIOCORE_NV3001B_BACKLIGHT_ACTIVE=PIN_TFT_LEDA_CTL_ACTIVE
  -D DISPLAY_ROTATION=3
  -D HELTEC_USE_ORLP_ED25519_VERIFY=1
  -D HELTEC_MESH_UI=1
  -D HELTEC_LICENSE_BOOT_GATE=0
  -D HELTEC_DISPLAY_NV3001B=1
  -D HELTEC_UI_DISPLAY_MONO=1
  -D HELTEC_UI_INPUT_TOUCH=0
  -D MOMENTARY_BUTTON_MAX=1
  -D ED25519_NO_SEED=1
  -D LV_CONF_SKIP=1
  -D LV_COLOR_DEPTH=16
  -D LV_DRAW_COMPLEX=1
  -D LV_MEM_SIZE=73728U
  -D LV_MEM_BUF_MAX_NUM=32
  -D LV_MEMCPY_MEMSET_STD=1
  -D LV_USE_LOG=0
  -D LV_TICK_CUSTOM=1
  -D LV_LAYER_SIMPLE_BUF_SIZE=3200U
  -D LV_SHADOW_CACHE_SIZE=0
  -D LV_GRAD_CACHE_DEF_SIZE=0
  -D LV_USE_GRID=0
  -D LV_USE_ANIMIMG=0
  -D LV_USE_THEME_DEFAULT=0
  -D LV_USE_THEME_BASIC=0
  -D LV_USE_THEME_MONO=1
  -D LV_BUILD_EXAMPLES=0
  -D LV_USE_DEMO_WIDGETS=0
  -D LV_USE_DEMO_KEYPAD_AND_ENCODER=0
  -D LV_USE_DEMO_BENCHMARK=0
  -D LV_USE_DEMO_STRESS=0
  -D LV_USE_DEMO_MUSIC=0
  -D LV_USE_KEYBOARD=1
  -D LV_USE_TEXTAREA=1
  -D LV_USE_ARC=0
  -D LV_USE_BAR=1
  -D LV_USE_CALENDAR=0
  -D LV_USE_CALENDAR_HEADER_ARROW=0
  -D LV_USE_CALENDAR_HEADER_DROPDOWN=0
  -D LV_USE_CANVAS=0
  -D LV_USE_CHART=0
  -D LV_USE_CHECKBOX=0
  -D LV_USE_ROLLER=0
  -D LV_USE_LED=0
  -D LV_USE_LIST=0
  -D LV_USE_MENU=1
  -D LV_USE_METER=0
  -D LV_USE_MSGBOX=0
  -D LV_USE_SLIDER=1
  -D LV_USE_SPAN=0
  -D LV_USE_SPINBOX=0
  -D LV_USE_SPINNER=0
  -D LV_USE_TABLE=0
  -D LV_USE_TABVIEW=0
  -D LV_USE_WIN=0
  -D LV_SPRINTF_USE_FLOAT=0
  -D LV_FONT_MONTSERRAT_10=0
  -D LV_FONT_MONTSERRAT_14=1
  -D LV_FONT_ARIAL_10=1
  '-D LV_FONT_CUSTOM_DECLARE=LV_FONT_DECLARE(lv_font_arial_10)'
  '-D LV_FONT_DEFAULT=&lv_font_montserrat_14'
  -fpermissive
build_src_filter =
  +<../variants/heltec_radio_core>
  -<../variants/heltec_radio_core/HeltecRadioCoreC6Board.cpp>
  -<../variants/heltec_radio_core/images.cpp>
  +<helpers/sensors>
lib_deps =
  stevemarple/MicroNMEA @ ^2.0.6
  file://lib/lvgl

[Heltec_radio_core_rc32]
extends = esp32_base, Heltec_radio_core_base
extra_scripts =
  ${esp32_base_ext.extra_scripts}
board = esp32-s3-devkitc-1
board_build.partitions = default_16MB.csv
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
build_flags =
  ${sensor_base.build_flags}
  ${esp32_base_ext.build_flags}
  ${Heltec_radio_core_base.build_flags}
  -D RADIOCORE_BOARD_RC32=1
  -D BOARD_HAS_PSRAM=1
  -D P_LORA_NSS=10
  -D P_LORA_DIO_1=14
  -D P_LORA_RESET=9
  -D P_LORA_BUSY=1
  -D P_LORA_SCLK=11
  -D P_LORA_MISO=13
  -D P_LORA_MOSI=12
  -D PIN_LORA_POWER=-1
  -D PIN_USER_BTN=0
  -D PIN_ADC_CTRL=15
  -D PIN_ADC_CTRL_ACTIVE=HIGH
  -D PIN_VBAT_READ=7
  -D BATTERY_ADC_MULTIPLIER=5.42F
  -D PIN_TFT_SCL=17
  -D PIN_TFT_DC=16
  -D PIN_TFT_VDD_CTL=6
  -D PIN_TFT_VDD_CTL_ACTIVE=LOW
  -D PIN_TFT_LEDA_CTL=5
  -D PIN_TFT_LEDA_CTL_ACTIVE=HIGH
  -D PIN_TFT_RST=4
  -D PIN_TFT_SDA=38
  -D PIN_TFT_CS=39
  -D RADIOCORE_NV3001B_MISO=-1
  -D RADIOCORE_NV3001B_RST=PIN_TFT_RST
  -D RADIOCORE_NV3001B_SPI_FREQUENCY=40000000U
  -D LV_MEM_CUSTOM=1
  -D LV_MEM_CUSTOM_INCLUDE=\"drivers/display/lv_mem_psram.h\"
  -D LV_MEM_CUSTOM_ALLOC=lv_mem_psram_alloc
  -D LV_MEM_CUSTOM_FREE=lv_mem_psram_free
  -D LV_MEM_CUSTOM_REALLOC=lv_mem_psram_realloc

build_src_filter = ${esp32_base_ext.build_src_filter} ${Heltec_radio_core_base.build_src_filter}
lib_deps =
  ${sensor_base.lib_deps}
  ${esp32_base_ext.lib_deps}
  ${Heltec_radio_core_base.lib_deps}

[Heltec_radio_core_rcc6]
extends = esp32c6_base, Heltec_radio_core_base
extra_scripts =
  ${esp32c6_base.extra_scripts}
board = esp32-c6-devkitm-1
board_build.partitions = default_16MB.csv
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
build_flags =
  ${esp32c6_base.build_flags}
  ${Heltec_radio_core_base.build_flags}
  -I lib/Network/src
  -D RADIOCORE_BOARD_RCC6=1
  -D PIN_BOARD_SDA=-1
  -D PIN_BOARD_SCL=-1
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ESP32_CPU_FREQ=160
  -D P_LORA_NSS=23
  -D P_LORA_DIO_1=19
  -D P_LORA_RESET=8
  -D P_LORA_BUSY=10
  -D P_LORA_SCLK=21
  -D P_LORA_MISO=20
  -D P_LORA_MOSI=22
  -D PIN_LORA_POWER=-1
  -D PIN_USER_BTN=9
  -D PIN_ADC_CTRL=5
  -D PIN_ADC_CTRL_ACTIVE=HIGH
  -D PIN_VBAT_READ=6
  -D BATTERY_ADC_MULTIPLIER=5.42F
  -D PIN_VEXT_EN=11
  -D PIN_VEXT_EN_ACTIVE=HIGH
  -D PIN_TFT_SCL=4
  -D PIN_TFT_DC=3
  -D PIN_TFT_VDD_CTL=2
  -D PIN_TFT_VDD_CTL_ACTIVE=LOW
  -D PIN_TFT_LEDA_CTL=1
  -D PIN_TFT_LEDA_CTL_ACTIVE=HIGH
  -D PIN_TFT_RST=0
  -D PIN_TFT_SDA=15
  -D PIN_TFT_CS=18
  -D RADIOCORE_NV3001B_SPI_HOST=FSPI
  -D RADIOCORE_NV3001B_MISO=-1
  -D RADIOCORE_NV3001B_RST=-1
  -D RADIOCORE_NV3001B_SPI_FREQUENCY=40000000U
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
build_src_filter = ${esp32c6_base.build_src_filter} ${Heltec_radio_core_base.build_src_filter}
lib_deps =
  ${esp32c6_base.lib_deps}
  ${Heltec_radio_core_base.lib_deps}
  file://lib/Network

[Heltec_radio_core_rc52]
extends = nrf52_base, Heltec_radio_core_base
board = heltec_radio_core
board_build.ldscript = boards/nrf52840_s140_v6.ld
build_flags =
  ${sensor_base.build_flags}
  ${nrf52_base.build_flags}
  ${Heltec_radio_core_base.build_flags}
  -I lib/nrf52/s140_nrf52_6.1.1_API/include
  -I lib/nrf52/s140_nrf52_6.1.1_API/include/nrf52
  -D RADIOCORE_BOARD_RC52=1
  -D CONFIG_NFCT_PINS_AS_GPIOS=1
  -D P_LORA_NSS=13
  -D P_LORA_DIO_1=11
  -D P_LORA_RESET=32
  -D P_LORA_BUSY=24
  -D P_LORA_SCLK=25
  -D P_LORA_MISO=14
  -D P_LORA_MOSI=22
  -D PIN_LORA_POWER=-1
  -D PIN_USER_BTN=42
  -D PIN_ADC_CTRL=4
  -D PIN_ADC_CTRL_ACTIVE=HIGH
  -D PIN_VBAT_READ=31
  -D BATTERY_ADC_MULTIPLIER=4.90F
  -D PIN_BOARD_SDA=21
  -D PIN_BOARD_SCL=18
  -D PIN_TFT_SCL=30
  -D PIN_TFT_DC=28
  -D PIN_TFT_VDD_CTL=45
  -D PIN_TFT_VDD_CTL_ACTIVE=LOW
  -D PIN_TFT_LEDA_CTL=9
  -D PIN_TFT_LEDA_CTL_ACTIVE=HIGH
  -D PIN_TFT_RST=10
  -D PIN_TFT_SDA=34
  -D PIN_TFT_MISO=-1
  -D PIN_TFT_CS=36
  -D RADIOCORE_NV3001B_MISO=PIN_TFT_MISO
  -D RADIOCORE_NV3001B_RST=PIN_TFT_RST
  -D RADIOCORE_NV3001B_SPI_FREQUENCY=20000000U
build_src_filter = ${nrf52_base.build_src_filter} ${Heltec_radio_core_base.build_src_filter}
lib_deps =
  ${sensor_base.lib_deps}
  ${nrf52_base.lib_deps}
  ${Heltec_radio_core_base.lib_deps}

[Heltec_radio_core_ui_sources]
build_src_filter =
  -<Identity.cpp>
  +<heltec/crypto/Identity.cpp>
  -<helpers/sensors/EnvironmentSensorManager.cpp>
  -<helpers/ui/MomentaryButton.cpp>
  +<heltec/drivers/display/lv_mem_psram.cpp>
  +<heltec/app/*.cpp>
  -<heltec/app/mesh_app_ui_map.cpp>
  -<heltec/app/map_geo.cpp>
  +<heltec/sensors/*.cpp>
  +<heltec/sensors/*.c>
  +<heltec/config/*.cpp>
  +<heltec/ui/*.cpp>
  +<heltec/ui/**/*.cpp>
  -<heltec/ui/map/*.cpp>
  +<../variants/heltec_t114/images.cpp>
  +<heltec/drivers/display/display_port.cpp>
  +<heltec/drivers/display/nv3001b_port.cpp>
  +<heltec/drivers/input/key_input.cpp>
  +<heltec/drivers/input/momentary_button.cpp>
  +<helpers/esp32/*.cpp>
lib_deps =
  densaugeo/base64 @ ~1.4.0
  end2endzone/NonBlockingRTTTL@^1.3.0

[Heltec_radio_core_rcc6_tft]
extends = Heltec_radio_core_rcc6
build_src_filter = ${Heltec_radio_core_rcc6.build_src_filter} ${Heltec_radio_core_ui_sources.build_src_filter}
  -<heltec/drivers/display/lv_mem_psram.cpp>
lib_deps = ${Heltec_radio_core_rcc6.lib_deps} ${Heltec_radio_core_ui_sources.lib_deps}

[Heltec_radio_core_rc32_tft]
extends = Heltec_radio_core_rc32
build_flags =
  ${Heltec_radio_core_rc32.build_flags}
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
build_src_filter = ${Heltec_radio_core_rc32.build_src_filter} ${Heltec_radio_core_ui_sources.build_src_filter}
lib_deps = ${Heltec_radio_core_rc32.lib_deps} ${Heltec_radio_core_ui_sources.lib_deps}

[Heltec_radio_core_rc52_tft]
extends = Heltec_radio_core_rc52
build_flags =
  ${Heltec_radio_core_rc52.build_flags}
  -D LV_USE_LINE=0
  -D LV_USE_PNG=0
  -D MAX_CONTACTS=200
  -D MAX_GROUP_CHANNELS=20
build_src_filter = ${Heltec_radio_core_rc52.build_src_filter} ${Heltec_radio_core_ui_sources.build_src_filter}
  -<heltec/drivers/display/lv_mem_psram.cpp>
  -<helpers/esp32/*.cpp>
lib_deps = ${Heltec_radio_core_rc52.lib_deps} ${Heltec_radio_core_ui_sources.lib_deps}

[Heltec_radio_core_ble]
build_flags =
  -D BLE_PIN_CODE=123456
  -D AUTO_SHUTDOWN_MILLIVOLTS=3400
  ;-D GPS_NMEA_DEBUG=1

; RC32 firmware targets.
[env:heltec_radio_core_rc32_companion_radio_usb]
extends = Heltec_radio_core_rc32_tft
build_src_filter = ${Heltec_radio_core_rc32_tft.build_src_filter}
  -<helpers/esp32/SerialBLEInterface.cpp>

[env:heltec_radio_core_rc32_companion_radio_ble]
extends = Heltec_radio_core_rc32_tft
build_flags =
  ${Heltec_radio_core_rc32_tft.build_flags}
  ${Heltec_radio_core_ble.build_flags}
  -D OFFLINE_QUEUE_SIZE=256
  -D MESH_DEBUG=1

; RCC6 firmware targets.
[env:heltec_radio_core_rcc6_companion_radio_usb]
extends = Heltec_radio_core_rcc6_tft
build_src_filter = ${Heltec_radio_core_rcc6_tft.build_src_filter}
  -<helpers/esp32/SerialBLEInterface.cpp>

[env:heltec_radio_core_rcc6_companion_radio_ble]
extends = Heltec_radio_core_rcc6_tft
build_flags =
  ${Heltec_radio_core_rcc6_tft.build_flags}
  ${Heltec_radio_core_ble.build_flags}
  -D OFFLINE_QUEUE_SIZE=256
  -D MESH_DEBUG=1

; RC52 firmware targets.
[env:heltec_radio_core_rc52_companion_radio_usb]
extends = Heltec_radio_core_rc52_tft

[env:heltec_radio_core_rc52_companion_radio_ble]
extends = Heltec_radio_core_rc52_tft
build_flags =
  ${Heltec_radio_core_rc52_tft.build_flags}
  ${Heltec_radio_core_ble.build_flags}
  -D OFFLINE_QUEUE_SIZE=64
  -D MESH_DEBUG=1
build_src_filter = ${Heltec_radio_core_rc52_tft.build_src_filter}
  +<helpers/nrf52/SerialBLEInterface.cpp>

; Backward-compatible RCC6 environment names.
[env:heltec_radio_core_companion_radio_usb]
extends = env:heltec_radio_core_rcc6_companion_radio_usb

[env:heltec_radio_core_companion_radio_ble]
extends = env:heltec_radio_core_rcc6_companion_radio_ble
