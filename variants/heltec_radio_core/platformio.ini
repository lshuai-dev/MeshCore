[Heltec_radio_core_base]
extends = lvgl_base
lib_ldf_mode = deep+
build_flags =
  ${lvgl_base.build_flags}
  ${lvgl_theme_mono.build_flags}
  -I variants/heltec_radio_core
  -D HELTEC_RADIO_CORE=1
  -D DISABLE_DS3231_PROBE=1
  -D USE_SX1262=1
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=22
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D SX126X_REGISTER_PATCH=1
  -D HELTEC_SENSOR_MANAGER=1
  -D RADIOCORE_HAS_NV3001B_DISPLAY=1
  -D DISPLAY_ROTATION=3
  ;-D HELTEC_LICENSE_BOOT_GATE=0
  -D LV_COLOR_DEPTH=16
  -D LV_FONT_MONTSERRAT_10=0
  -D LV_FONT_MONTSERRAT_12=1
  '-D LV_FONT_DEFAULT=&lv_font_montserrat_12'
build_src_filter =
  +<../variants/heltec_radio_core>
  -<../variants/heltec_radio_core/Images.cpp>
  +<helpers/sensors>
lib_deps =
  ${lvgl_base.lib_deps}
  stevemarple/MicroNMEA @ ^2.0.6

[Heltec_radio_core_rc32]
extends = esp32_base, Heltec_radio_core_base
extra_scripts =
  ${esp32_base_ext.extra_scripts}
board = heltec-rc32
board_build.partitions = default_16MB.csv
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
build_flags =
  ${sensor_base.build_flags}
  ${esp32_base_ext.build_flags}
  ${Heltec_radio_core_base.build_flags}
  -D RADIOCORE_BOARD_RC32=1
  -D BOARD_HAS_PSRAM=1
  -D ENV_INCLUDE_GPS=1
  -D ENV_INCLUDE_COMPASS=1
  -D ICM_COMPASS_LOOP_MS=50
  -D COMPASS_HEADING_OFFSET_DEG=180
  -D PIN_BOARD_SDA=21
  -D PIN_BOARD_SCL=18
  -D PIN_SENSOR_EN=46
  -D PIN_SENSOR_EN_ACTIVE=HIGH
  -D PIN_SENSOR_INT=42
  -D PIN_SENSOR_RST=2
  -D PIN_PWM=48
  -D PIN_BUZZER=48
  -D P_LORA_TX_LED=47
  -D PIN_GPS_TX=44
  -D PIN_GPS_RX=43
  -D PIN_GPS_EN=45
  -D PIN_GPS_EN_ACTIVE=HIGH
  -D PIN_GPS_RESET=40
  -D PIN_GPS_RESET_ACTIVE=LOW
  -D PIN_GPS_PPS=41
  -D GPS_BAUD_RATE=9600
  -D P_LORA_NSS=10
  -D P_LORA_DIO_1=14
  -D P_LORA_RESET=9
  -D P_LORA_BUSY=1
  -D P_LORA_SCLK=11
  -D P_LORA_MISO=13
  -D P_LORA_MOSI=12
  -D PIN_LORA_POWER=-1
  -D PIN_USER_BTN=0
  -D PIN_ADC_CTRL=15
  -D PIN_ADC_CTRL_ACTIVE=HIGH
  -D PIN_VBAT_READ=7
  -D BATTERY_ADC_MULTIPLIER=5.42F
  -D PIN_TFT_SCL=17
  -D PIN_TFT_DC=16
  -D PIN_TFT_VDD_CTL=6
  -D PIN_TFT_VDD_CTL_ACTIVE=LOW
  -D PIN_TFT_LEDA_CTL=5
  -D PIN_TFT_LEDA_CTL_ACTIVE=HIGH
  -D PIN_TFT_RST=4
  -D PIN_TFT_SDA=38
  -D PIN_TFT_CS=39
  -D PIN_TFT_MISO=-1
  -D RADIOCORE_NV3001B_SPI_FREQUENCY=40000000U
  -D LV_MEM_CUSTOM=1
  -D LV_MEM_CUSTOM_INCLUDE=\"drivers/display/LvMemPsram.h\"
  -D LV_MEM_CUSTOM_ALLOC=lv_mem_psram_alloc
  -D LV_MEM_CUSTOM_FREE=lv_mem_psram_free
  -D LV_MEM_CUSTOM_REALLOC=lv_mem_psram_realloc

build_src_filter = ${esp32_base_ext.build_src_filter} ${Heltec_radio_core_base.build_src_filter}
  -<../variants/heltec_radio_core/Rc52Board.cpp>
  -<../variants/heltec_radio_core/Rcc6Board.cpp>
lib_deps =
  ${sensor_base.lib_deps}
  ${esp32_base_ext.lib_deps}
  ${Heltec_radio_core_base.lib_deps}

[Heltec_radio_core_rcc6]
extends = esp32c6_base, Heltec_radio_core_base
extra_scripts =
  ${esp32c6_base.extra_scripts}
board = esp32-c6-devkitm-1
board_build.partitions = default_16MB.csv
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
build_flags =
  ${esp32c6_base.build_flags}
  ${Heltec_radio_core_base.build_flags}
  -I lib/Network/src
  -D RADIOCORE_BOARD_RCC6=1
  -D ENV_INCLUDE_GPS=0
  -D PIN_BOARD_SDA=-1
  -D PIN_BOARD_SCL=-1
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ESP32_CPU_FREQ=160
  -D P_LORA_NSS=23
  -D P_LORA_DIO_1=19
  -D P_LORA_RESET=8
  -D P_LORA_BUSY=10
  -D P_LORA_SCLK=21
  -D P_LORA_MISO=20
  -D P_LORA_MOSI=22
  -D PIN_LORA_POWER=-1
  -D PIN_USER_BTN=9
  -D PIN_ADC_CTRL=5
  -D PIN_ADC_CTRL_ACTIVE=HIGH
  -D PIN_VBAT_READ=6
  -D BATTERY_ADC_MULTIPLIER=5.42F
  -D PIN_VEXT_EN=11
  -D PIN_VEXT_EN_ACTIVE=HIGH
  -D PIN_TFT_SCL=4
  -D PIN_TFT_DC=3
  -D PIN_TFT_VDD_CTL=2
  -D PIN_TFT_VDD_CTL_ACTIVE=LOW
  -D PIN_TFT_LEDA_CTL=1
  -D PIN_TFT_LEDA_CTL_ACTIVE=HIGH
  -D PIN_TFT_RST=0
  -D PIN_TFT_SDA=15
  -D PIN_TFT_CS=18
  -D RADIOCORE_NV3001B_SPI_HOST=FSPI
  -D PIN_TFT_MISO=-1
  -D RADIOCORE_NV3001B_SPI_FREQUENCY=40000000U
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
build_src_filter = ${esp32c6_base.build_src_filter} ${Heltec_radio_core_base.build_src_filter}
  -<../variants/heltec_radio_core/Rc32Board.cpp>
  -<../variants/heltec_radio_core/Rc52Board.cpp>
lib_deps =
  ${esp32c6_base.lib_deps}
  ${Heltec_radio_core_base.lib_deps}
  file://lib/Network

[Heltec_radio_core_rc52]
extends = nrf52_base, Heltec_radio_core_base
board = heltec_radio_core
board_build.ldscript = boards/nrf52840_s140_v6.ld
build_flags =
  ${sensor_base.build_flags}
  ${nrf52_base.build_flags}
  ${Heltec_radio_core_base.build_flags}
  -I lib/nrf52/s140_nrf52_6.1.1_API/include
  -I lib/nrf52/s140_nrf52_6.1.1_API/include/nrf52
  -D RADIOCORE_BOARD_RC52=1
  -D ENV_INCLUDE_GPS=1
  -D ENV_INCLUDE_COMPASS=1
  -D CONFIG_NFCT_PINS_AS_GPIOS=1
  -D WIRE_INTERFACES_COUNT=1
  -D SPI_INTERFACES_COUNT=1
  -D SPI_32MHZ_INTERFACE=1
  -D PIN_GPS_EN=41
  -D PIN_GPS_EN_ACTIVE=HIGH
  -D PIN_GPS_TX=8
  -D PIN_GPS_RX=7
  -D PIN_GPS_PPS=33
  -D PIN_GPS_RESET=38
  -D PIN_GPS_RESET_ACTIVE=LOW
  -D GPS_L76K
  -D PIN_SERIAL1_RX=8
  -D PIN_SERIAL1_TX=7
  -D PIN_SENSOR_EN=12
  -D PIN_SENSOR_EN_ACTIVE=HIGH
  -D PIN_SENSOR_INT=20
  -D PIN_SENSOR_RST=47
  -D PIN_PWM=5
  -D PIN_BUZZER=5
  -D PIN_STATUS_LED=15
  -D P_LORA_NSS=13
  -D P_LORA_DIO_1=11
  -D P_LORA_RESET=32
  -D P_LORA_BUSY=24
  -D P_LORA_SCLK=25
  -D P_LORA_MISO=14
  -D P_LORA_MOSI=22
  -D PIN_SPI_NSS=13
  -D PIN_SPI_SCK=25
  -D PIN_SPI_MISO=14
  -D PIN_SPI_MOSI=22
  -D PIN_LORA_POWER=-1
  -D PIN_USER_BTN=42
  -D PIN_ADC_CTRL=4
  -D PIN_ADC_CTRL_ACTIVE=HIGH
  -D PIN_VBAT_READ=31
  -D BATTERY_ADC_MULTIPLIER=4.90F
  -D PIN_WIRE_SDA=43
  -D PIN_WIRE_SCL=2
  -D PIN_TFT_SCL=30
  -D PIN_TFT_DC=28
  -D PIN_TFT_VDD_CTL=45
  -D PIN_TFT_VDD_CTL_ACTIVE=LOW
  -D PIN_TFT_LEDA_CTL=9
  -D PIN_TFT_LEDA_CTL_ACTIVE=HIGH
  -D PIN_TFT_RST=10
  -D PIN_TFT_SDA=34
  -D PIN_TFT_MISO=-1
  -D PIN_TFT_CS=36
  -D RADIOCORE_NV3001B_SPI_FREQUENCY=20000000U
build_src_filter = ${nrf52_base.build_src_filter} ${Heltec_radio_core_base.build_src_filter}
  -<../variants/heltec_radio_core/Rc32Board.cpp>
  -<../variants/heltec_radio_core/Rcc6Board.cpp>
lib_deps =
  ${sensor_base.lib_deps}
  ${nrf52_base.lib_deps}
  ${Heltec_radio_core_base.lib_deps}

[Heltec_radio_core_ui_sources]
extends = lvgl_base
build_src_filter = ${lvgl_base.build_src_filter} ${lvgl_theme_mono.build_src_filter}
  -<helpers/sensors/EnvironmentSensorManager.cpp>
  -<helpers/ui/MomentaryButton.cpp>
  +<heltec/sensors/IcmCompassProvider.cpp>
  +<heltec/sensors/MemsicStackChkShim.c>
  +<../variants/heltec_radio_core/Images.cpp>
  +<heltec/drivers/display/Nv3001bPort.cpp>
lib_deps = ${lvgl_base.lib_deps}

[Heltec_radio_core_rcc6_tft]
extends = Heltec_radio_core_rcc6
build_flags =
  ${Heltec_radio_core_rcc6.build_flags}
  -D LV_MEM_SIZE=81920U
  -D LV_MEM_BUF_MAX_NUM=8
  -D LV_LAYER_SIMPLE_BUF_SIZE=3200U
build_src_filter = ${Heltec_radio_core_rcc6.build_src_filter} ${Heltec_radio_core_ui_sources.build_src_filter}
  -<heltec/drivers/display/LvMemPsram.cpp>
lib_deps = ${Heltec_radio_core_rcc6.lib_deps} ${Heltec_radio_core_ui_sources.lib_deps}

[Heltec_radio_core_rc32_tft]
extends = Heltec_radio_core_rc32
build_flags =
  ${Heltec_radio_core_rc32.build_flags}
  -D LV_MEM_SIZE=81920U
  -D LV_MEM_BUF_MAX_NUM=8
  -D LV_LAYER_SIMPLE_BUF_SIZE=3200U
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
build_src_filter = ${Heltec_radio_core_rc32.build_src_filter} ${Heltec_radio_core_ui_sources.build_src_filter}
  +<heltec/drivers/display/LvMemPsram.cpp>
lib_deps = ${Heltec_radio_core_rc32.lib_deps} ${Heltec_radio_core_ui_sources.lib_deps}

[Heltec_radio_core_rc52_tft]
extends = Heltec_radio_core_rc52
build_flags =
  ${Heltec_radio_core_rc52.build_flags}
  -D LV_MEM_SIZE=81920U
  -D LV_LAYER_SIMPLE_BUF_SIZE=3200U
  -D LV_USE_LINE=0
  -D LV_USE_PNG=0
  -D MAX_CONTACTS=200
  -D MAX_GROUP_CHANNELS=32
  -D OFFLINE_QUEUE_SIZE=128
build_src_filter = ${Heltec_radio_core_rc52.build_src_filter} ${Heltec_radio_core_ui_sources.build_src_filter}
  -<heltec/drivers/display/LvMemPsram.cpp>
  -<helpers/esp32/*.cpp>
lib_deps = ${Heltec_radio_core_rc52.lib_deps} ${Heltec_radio_core_ui_sources.lib_deps}

[Heltec_radio_core_ble]
build_flags =
  -D BLE_PIN_CODE=123456
  -D AUTO_SHUTDOWN_MILLIVOLTS=3400
  ;-D GPS_NMEA_DEBUG=1

; RC32 firmware targets.
[env:heltec_radio_core_rc32_companion_radio_usb]
extends = Heltec_radio_core_rc32_tft
build_src_filter = ${Heltec_radio_core_rc32_tft.build_src_filter}
  -<helpers/esp32/SerialBLEInterface.cpp>

[env:heltec_radio_core_rc32_companion_radio_ble]
extends = Heltec_radio_core_rc32_tft
build_flags =
  ${Heltec_radio_core_rc32_tft.build_flags}
  ${Heltec_radio_core_ble.build_flags}
  -D OFFLINE_QUEUE_SIZE=256
  ;-D MESH_DEBUG=1
build_src_filter = ${Heltec_radio_core_rc32_tft.build_src_filter}
  +<helpers/esp32/SerialBLEInterface.cpp>

; RCC6 firmware targets.
[env:heltec_radio_core_rcc6_companion_radio_usb]
extends = Heltec_radio_core_rcc6_tft
build_src_filter = ${Heltec_radio_core_rcc6_tft.build_src_filter}
  -<helpers/esp32/SerialBLEInterface.cpp>

[env:heltec_radio_core_rcc6_companion_radio_ble]
extends = Heltec_radio_core_rcc6_tft
build_flags =
  ${Heltec_radio_core_rcc6_tft.build_flags}
  ${Heltec_radio_core_ble.build_flags}
  -D OFFLINE_QUEUE_SIZE=256
  ;-D MESH_DEBUG=1
build_src_filter = ${Heltec_radio_core_rcc6_tft.build_src_filter}
  +<helpers/esp32/SerialBLEInterface.cpp>

; RC52 firmware targets.
[env:heltec_radio_core_rc52_companion_radio_usb]
extends = Heltec_radio_core_rc52_tft

[env:heltec_radio_core_rc52_companion_radio_ble]
extends = Heltec_radio_core_rc52_tft
build_flags =
  ${Heltec_radio_core_rc52_tft.build_flags}
  ${Heltec_radio_core_ble.build_flags}
  ; RELEASE_DISABLED: -D MESH_DEBUG=1
  ;-D GPS_NMEA_DEBUG=1
build_src_filter = ${Heltec_radio_core_rc52_tft.build_src_filter}
  +<helpers/nrf52/SerialBLEInterface.cpp>
