[Heltec_tracker_v2]
extends = esp32_base
board = heltec_tracker_v2
build_flags =
  ${esp32_base.build_flags}
  ${sensor_base.build_flags}
  -I variants/heltec_tracker_v2
  -D HELTEC_TRACKER_V2
  -D HAS_LNA_CONTROL=1
  -D ESP32_CPU_FREQ=160
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D P_LORA_TX_LED=18
  -D P_LORA_DIO_1=14
  -D P_LORA_NSS=8
  -D P_LORA_RESET=12
  -D P_LORA_BUSY=13
  -D P_LORA_SCLK=9
  -D P_LORA_MISO=11
  -D P_LORA_MOSI=10
  -D P_LORA_PA_POWER=7  ;VFEM_Ctrl -LDO power enable
  -D P_LORA_KCT8103L_PA_CSD=4
  -D P_LORA_KCT8103L_PA_CTX=5
  -D LORA_TX_POWER=9    ; 9dBm + ~13dB KCT8103L gain = ~22dBm output
  -D MAX_LORA_TX_POWER=22 ; Max SX1262 output -> ~28dBm at antenna
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D SX126X_REGISTER_PATCH=1
  -D PIN_BOARD_SDA=6
  -D PIN_BOARD_SCL=17
  -D PIN_USER_BTN=0
  -D PIN_TFT_SDA=42   ; SDIN
  -D PIN_TFT_SCL=41   ; SCLK
  -D PIN_TFT_DC=40    ; RS (register select)
  -D PIN_TFT_RST=39   ; RES
  -D PIN_TFT_CS=38
  -D USE_PIN_TFT=1
  -D PIN_VEXT_EN=3   ; Vext is connected to VDD which is also connected to OLED & GPS
  -D PIN_VEXT_EN_ACTIVE=HIGH
  -D PIN_TFT_LEDA_CTL=21 ; LEDK (switches on/off via mosfet to create the ground)
  -D DISPLAY_ROTATION=1
  -D PIN_GPS_RX=34
  -D PIN_GPS_TX=33
  -D PIN_GPS_RESET=35
  -D PIN_GPS_RESET_ACTIVE=LOW
  -D GPS_UC6580=1
  -D GPS_UC6580_CONFIGURE=1
  -D GPS_BAUD_RATE=115200
  -D ENV_INCLUDE_GPS=1
  -D ENV_SKIP_GPS_DETECT=1
  -D PIN_ADC_CTRL=2
  -D PIN_VBAT_READ=1
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/heltec_tracker_v2>
  +<helpers/sensors>
lib_deps =
  ${esp32_base.lib_deps}
  ${sensor_base.lib_deps}
  adafruit/Adafruit ST7735 and ST7789 Library @ ^1.11.0

[Heltec_tracker_v2_tft]
extends = Heltec_tracker_v2
lib_ldf_mode = chain+
build_flags =
  ${Heltec_tracker_v2.build_flags}
  ${heltec_ui_common.build_flags}
  -I src/heltec
  -D HELTEC_USE_ORLP_ED25519_VERIFY=1
  -D HELTEC_MESH_UI=1
  -D HELTEC_LICENSE_BOOT_GATE=0
  -D HELTEC_DISPLAY_ST7735=1
  -D ST7735_LVGL_INVERT=0
  -D HELTEC_ST7735_Y_GAP_ADJUST=0
  -D HELTEC_ST7735_EXTRA_CLEAR_RIGHT=1
  -D HELTEC_ST7735_EXTRA_CLEAR_BOTTOM=2
  -D PIN_TFT_LEDA_CTL_ACTIVE=HIGH
  -D UI_THEME_MONO=1
  -D MOMENTARY_BUTTON_MAX=1
  -D ED25519_NO_SEED
  -D LV_CONF_SKIP=1
  -D LV_COLOR_DEPTH=16
  -D LV_DRAW_COMPLEX=1
  -D LV_MEM_CUSTOM=1
  -D LV_MEM_CUSTOM_INCLUDE=\"drivers/display/lv_mem_psram.h\"
  -D LV_MEM_CUSTOM_ALLOC=lv_mem_psram_alloc
  -D LV_MEM_CUSTOM_FREE=lv_mem_psram_free
  -D LV_MEM_CUSTOM_REALLOC=lv_mem_psram_realloc
  -D LV_MEM_BUF_MAX_NUM=32
  -D LV_MEMCPY_MEMSET_STD=1
  -D LV_USE_LOG=0
  -D LV_TICK_CUSTOM=1
  -D LV_LAYER_SIMPLE_BUF_SIZE=3200U
  -D LV_SHADOW_CACHE_SIZE=0
  -D LV_GRAD_CACHE_DEF_SIZE=0
  -D LV_USE_GRID=0
  -D LV_USE_ANIMIMG=0
  -D LV_USE_THEME_DEFAULT=0
  -D LV_USE_THEME_BASIC=0
  -D LV_USE_THEME_MONO=1
  -D LV_BUILD_EXAMPLES=0
  -D LV_USE_DEMO_WIDGETS=0
  -D LV_USE_DEMO_KEYPAD_AND_ENCODER=0
  -D LV_USE_DEMO_BENCHMARK=0
  -D LV_USE_DEMO_STRESS=0
  -D LV_USE_DEMO_MUSIC=0
  -D LV_USE_KEYBOARD=1
  -D LV_USE_TEXTAREA=1
  -D LV_USE_ARC=0
  -D LV_USE_BAR=0
  -D LV_USE_CALENDAR=0
  -D LV_USE_CALENDAR_HEADER_ARROW=0
  -D LV_USE_CALENDAR_HEADER_DROPDOWN=0
  -D LV_USE_CANVAS=0
  -D LV_USE_CHART=0
  -D LV_USE_CHECKBOX=0
  -D LV_USE_ROLLER=0
  -D LV_USE_LED=0
  -D LV_USE_LIST=0
  -D LV_USE_MENU=1
  -D LV_USE_METER=0
  -D LV_USE_MSGBOX=0
  -D LV_USE_SLIDER=0
  -D LV_USE_SPAN=0
  -D LV_USE_SPINBOX=0
  -D LV_USE_SPINNER=0
  -D LV_USE_TABLE=0
  -D LV_USE_TABVIEW=0
  -D LV_USE_WIN=0
  -D LV_SPRINTF_USE_FLOAT=0
  -D PREVIEW_AUTO_DISMISS_MS=15000
  -D LV_FONT_MONTSERRAT_10=0
  -D LV_FONT_ARIAL_10=1
  -D LV_FONT_CUSTOM_DECLARE=LV_FONT_DECLARE(lv_font_arial_10)
  '-D LV_FONT_DEFAULT=&lv_font_arial_10'
  -fpermissive
build_src_filter = ${Heltec_tracker_v2.build_src_filter}
  -<Identity.cpp>
  +<heltec/crypto/Identity.cpp>
  -<helpers/ui/MomentaryButton.cpp>
  +<heltec/drivers/display/lv_mem_psram.cpp>
  +<heltec/app/*.cpp>
  -<heltec/app/mesh_app_ui_map.cpp>
  -<heltec/app/map_geo.cpp>
  +<heltec/config/*.cpp>
  +<heltec/ui/*.cpp>
  +<heltec/ui/**/*.cpp>
  -<heltec/ui/theme/ui_theme_pixel.cpp>
  -<heltec/ui/map/*.cpp>
  +<../variants/heltec_tracker/images.cpp>
  +<heltec/drivers/display/display_port.cpp>
  +<heltec/drivers/display/st7735_port.cpp>
  +<heltec/drivers/input/key_input.cpp>
  +<heltec/drivers/input/momentary_button.cpp>
  +<helpers/esp32/*.cpp>
lib_deps =
  ${Heltec_tracker_v2.lib_deps}
  densaugeo/base64 @ ~1.4.0
  end2endzone/NonBlockingRTTTL@^1.3.0
  file://lib/lvgl

[env:heltec_tracker_v2_repeater]
extends = Heltec_tracker_v2
build_flags =
  ${Heltec_tracker_v2.build_flags}
  -D DISPLAY_CLASS=ST7735Display
  -D ADVERT_NAME='"Heltec Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${Heltec_tracker_v2.build_src_filter}
  +<helpers/ui/ST7735Display.cpp>
  +<../examples/simple_repeater>
lib_deps =
  ${Heltec_tracker_v2.lib_deps}
  ${esp32_ota.lib_deps}
  bakercp/CRC32 @ ^2.0.0

[env:heltec_tracker_v2_repeater_bridge_espnow]
extends = Heltec_tracker_v2
build_flags =
