[Heltec_tracker_v2]
extends = esp32_base
board = heltec_tracker_v2
build_flags =
  ${esp32_base.build_flags}
  ${sensor_base.build_flags}
  -I variants/heltec_tracker_v2
  -include variants/heltec_tracker_v2/variant.h
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/heltec_tracker_v2>
  -<../variants/heltec_tracker_v2/Images.cpp>
  +<helpers/sensors>
lib_deps =
  ${esp32_base.lib_deps}
  ${sensor_base.lib_deps}
  bodmer/TFT_eSPI @ ^2.4.31

[Heltec_tracker_v2_tft]
extends = Heltec_tracker_v2, lvgl_base
lib_ldf_mode = chain+
build_flags =
  ${Heltec_tracker_v2.build_flags}
  ${lvgl_base.build_flags}
  ${lvgl_theme_mono.build_flags}
  -D LV_MEM_SIZE=73728U
  -D LV_FONT_MONTSERRAT_10=0
  -D LV_FONT_ARIAL_10=1
  -D LV_FONT_CUSTOM_DECLARE=LV_FONT_DECLARE(lv_font_arial_10)
  '-D LV_FONT_DEFAULT=&lv_font_arial_10'
  -D HELTEC_SENSOR_MANAGER=1
  -D ENV_INCLUDE_GPS=1
  -D GPS_UC6580=1
  -D ST7735_LVGL_INVERT=0
  -D HELTEC_ST7735_Y_GAP_ADJUST=0
  -D HELTEC_ST7735_EXTRA_CLEAR_RIGHT=1
  -D HELTEC_ST7735_EXTRA_CLEAR_BOTTOM=2
  -D LV_COLOR_DEPTH=16
build_src_filter = ${Heltec_tracker_v2.build_src_filter} ${lvgl_base.build_src_filter} ${lvgl_theme_mono.build_src_filter}
  -<helpers/sensors/EnvironmentSensorManager.cpp>
  -<helpers/ui/MomentaryButton.cpp>
  +<heltec/sensors/*.cpp>
  +<heltec/sensors/*.c>
  +<../variants/heltec_tracker_v2/Images.cpp>
  +<heltec/drivers/display/St7735Port.cpp>
  +<helpers/esp32/*.cpp>
lib_deps =
  ${Heltec_tracker_v2.lib_deps}
  ${lvgl_base.lib_deps}

[env:heltec_tracker_v2_repeater]
extends = Heltec_tracker_v2
build_flags =
  ${Heltec_tracker_v2.build_flags}
  -D DISPLAY_CLASS=ST7735Display
  -D ADVERT_NAME='"Heltec Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${Heltec_tracker_v2.build_src_filter}
  +<helpers/ui/ST7735Display.cpp>
  +<../examples/simple_repeater>
lib_deps =
  ${Heltec_tracker_v2.lib_deps}
  ${esp32_ota.lib_deps}
  bakercp/CRC32 @ ^2.0.0

[env:heltec_tracker_v2_repeater_bridge_espnow]
extends = Heltec_tracker_v2
build_flags =
  ${Heltec_tracker_v2.build_flags}
  -D DISPLAY_CLASS=ST7735Display
  -D ADVERT_NAME='"ESPNow Bridge"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -D WITH_ESPNOW_BRIDGE=1
;  -D BRIDGE_DEBUG=1
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${Heltec_tracker_v2.build_src_filter}
  +<helpers/bridges/ESPNowBridge.cpp>
  +<helpers/ui/ST7735Display.cpp>
  +<../examples/simple_repeater>
lib_deps =
  ${Heltec_tracker_v2.lib_deps}
  ${esp32_ota.lib_deps}

[env:heltec_tracker_v2_room_server]
extends = Heltec_tracker_v2
build_flags =
  ${Heltec_tracker_v2.build_flags}
  -D DISPLAY_CLASS=ST7735Display
  -D ADVERT_NAME='"Heltec Room"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ROOM_PASSWORD='"hello"'
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${Heltec_tracker_v2.build_src_filter}
  +<helpers/ui/ST7735Display.cpp>
  +<../examples/simple_room_server>
lib_deps =
  ${Heltec_tracker_v2.lib_deps}
  ${esp32_ota.lib_deps}

[env:heltec_tracker_v2_terminal_chat]
extends = Heltec_tracker_v2, terminal_base
build_flags =
  ${Heltec_tracker_v2.build_flags}
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${Heltec_tracker_v2.build_src_filter}
  +<../examples/simple_secure_chat/main.cpp>
lib_deps =
  ${Heltec_tracker_v2.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:heltec_tracker_v2_companion_radio_usb]
extends = Heltec_tracker_v2_tft, companion_base
build_flags =
  ${Heltec_tracker_v2_tft.build_flags}
  -D ENABLE_USB_INTERFACE
; NOTE: DO NOT ENABLE -->  -D MESH_PACKET_LOGGING=1
; NOTE: DO NOT ENABLE -->  -D MESH_DEBUG=1
build_src_filter = ${Heltec_tracker_v2_tft.build_src_filter}
lib_deps =
  ${Heltec_tracker_v2_tft.lib_deps}

[env:heltec_tracker_v2_companion_radio_ble]
extends = Heltec_tracker_v2_tft, companion_base
build_flags =
  ${Heltec_tracker_v2_tft.build_flags}
  -D MAX_CONTACTS=300
  -D BLE_PIN_CODE=123456   ; dynamic, random PIN
  -D AUTO_SHUTDOWN_MILLIVOLTS=3400
  ; -D BLE_DEBUG_LOGGING=1
  ; -D BLE_DEBUG_LOGGING=1
  ; -D MESH_PACKET_LOGGING=1
  ; RELEASE_DISABLED: -D MESH_DEBUG=1
build_src_filter = ${Heltec_tracker_v2_tft.build_src_filter}
lib_deps =
  ${Heltec_tracker_v2_tft.lib_deps}

[env:heltec_tracker_v2_companion_radio_wifi]
extends = Heltec_tracker_v2_tft, companion_base
build_flags =
  ${Heltec_tracker_v2_tft.build_flags}
  ; -D WIFI_DEBUG_LOGGING=1
  -D WIFI_SSID='"myssid"'
  -D WIFI_PWD='"mypwd"'
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${Heltec_tracker_v2_tft.build_src_filter}
lib_deps =
  ${Heltec_tracker_v2_tft.lib_deps}

[env:heltec_tracker_v2_sensor]
extends = Heltec_tracker_v2
build_flags =
  ${Heltec_tracker_v2.build_flags}
  -D ADVERT_NAME='"Heltec Tracker V2 Sensor"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D DISPLAY_CLASS=ST7735Display
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${Heltec_tracker_v2.build_src_filter}
  +<helpers/ui/ST7735Display.cpp>
  +<../examples/simple_sensor>
lib_deps =
  ${Heltec_tracker_v2.lib_deps}
  ${esp32_ota.lib_deps}

[env:heltec_tracker_v2_kiss_modem]
extends = Heltec_tracker_v2
build_src_filter = ${Heltec_tracker_v2.build_src_filter}
  +<../examples/kiss_modem/>
